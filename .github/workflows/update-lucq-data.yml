name: Update LucQ Data

on:
  workflow_dispatch:
    inputs:
      betting_day:
        description: "LucQ betting day YYYY-MM-DD; empty uses current Europe/Bratislava day"
        required: false
        default: ""
        type: string
      commit_outputs:
        description: "Commit LucQ output and rendered site"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  repository_dispatch:
    types:
      - update-lucq-data

permissions:
  contents: write

concurrency:
  group: update-lucq-data-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TZ: Europe/Bratislava
  RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
  TENNISAPI_RAPIDAPI_HOST: ${{ vars.TENNISAPI_RAPIDAPI_HOST || 'tennisapi1.p.rapidapi.com' }}
  TENNISAPI_PROVIDER_IDS: ${{ vars.TENNISAPI_ODDS_PROVIDER_IDS || '1' }}
  TENNISAPI_ATTACH_RANKINGS: "0"
  TENNISAPI_H2H_STATS_ENABLED: "0"
  TENNISAPI_H2H_NAME_FALLBACK_ENABLED: "0"
  LUCQ_SOURCE_POLICY: API_PRO_ONLY
  LUCQ_MODEL_LABEL: LucQ
  LUCQ_SORT_FIELD: lucq_probability
  LUCQ_SORT_DIRECTION: desc
  LUCQ_ENABLE_TOP10_PICKS: "0"

jobs:
  update-lucq:
    name: Build LucQ API PRO data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve betting day
        id: betting-day
        shell: bash
        env:
          MANUAL_DAY: ${{ github.event.inputs.betting_day || '' }}
          DISPATCH_DAY: ${{ github.event.client_payload.betting_day || '' }}
        run: |
          BETTING_DAY="${MANUAL_DAY:-${DISPATCH_DAY:-}}"
          if [ -z "$BETTING_DAY" ]; then
            BETTING_DAY="$(TZ=Europe/Bratislava date +%F)"
          fi
          if ! printf '%s' "$BETTING_DAY" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid betting day: $BETTING_DAY"
            exit 1
          fi
          echo "betting_day=$BETTING_DAY" >> "$GITHUB_OUTPUT"
          echo "LucQ betting day: $BETTING_DAY"

      - name: Validate LucQ entrypoint
        run: |
          test -f lucq/builder.py || {
            echo "Missing lucq/builder.py"
            exit 1
          }

      - name: Build LucQ API PRO data
        run: |
          python -m lucq.builder \
            --date "${{ steps.betting-day.outputs.betting_day }}" \
            --output "outputs/lucq/latest_lucq.json"

      - name: Validate LucQ output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/lucq/latest_lucq.json")
          if not path.exists():
              raise SystemExit("Missing outputs/lucq/latest_lucq.json")

          payload = json.loads(path.read_text(encoding="utf-8"))
          rows = payload.get("rows") if isinstance(payload, dict) else None
          if not isinstance(rows, list):
              raise SystemExit("LucQ output rows must be a list")

          previous = None
          for index, row in enumerate(rows, start=1):
              probability = row.get("lucq_probability")
              if probability is None:
                  raise SystemExit(f"Row {index} has no lucq_probability")
              probability = float(probability)
              if not 0.0 <= probability <= 1.0:
                  raise SystemExit(f"Row {index} probability is outside 0..1")
              if previous is not None and probability > previous + 1e-12:
                  raise SystemExit("Rows are not sorted by LucQ probability descending")
              previous = probability

              source = " ".join(str(row.get(key) or "") for key in (
                  "source", "data_source", "probability_source", "source_policy"
              )).lower()
              if "api pro" not in source and "api_pro" not in source:
                  raise SystemExit(f"Row {index} has no API PRO provenance")

          print(f"LucQ output valid: rows={len(rows)}")
          PY

      - name: Render web
        run: |
          python -m corq.web.render

      - name: Upload LucQ artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucq-data-${{ steps.betting-day.outputs.betting_day }}
          path: outputs/lucq/latest_lucq.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit LucQ output and rendered site
        if: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.commit_outputs == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- outputs/lucq/latest_lucq.json corq/site; then
            echo "No LucQ or rendered-site changes to commit."
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$tmp_dir"
          }
          trap cleanup EXIT

          mkdir -p "$tmp_dir/outputs/lucq" "$tmp_dir/corq"
          cp -a outputs/lucq/latest_lucq.json "$tmp_dir/outputs/lucq/latest_lucq.json"
          cp -a corq/site "$tmp_dir/corq/site"

          git fetch origin main
          git reset --hard origin/main

          mkdir -p outputs/lucq corq
          cp -a "$tmp_dir/outputs/lucq/latest_lucq.json" outputs/lucq/latest_lucq.json
          rm -rf corq/site
          cp -a "$tmp_dir/corq/site" corq/site

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/lucq/latest_lucq.json corq/site

          if git diff --cached --quiet; then
            echo "No LucQ or rendered-site changes after syncing latest main."
            exit 0
          fi

          git commit -m "Update LucQ data for ${{ steps.betting-day.outputs.betting_day }}"
          git push origin HEAD:main
