name: Update LucQ Data

on:
  workflow_dispatch:
    inputs:
      betting_day:
        description: "LucQ betting day YYYY-MM-DD; empty uses Europe/Bratislava 06:00 day"
        required: false
        default: ""
        type: string
      overwrite_snapshot:
        description: "Allow replacement of an existing immutable daily Top 10 snapshot"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  repository_dispatch:
    types:
      - update-lucq-data

permissions:
  contents: write
  actions: write

concurrency:
  group: update-lucq-data-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
  TENNISAPI_RAPIDAPI_HOST: ${{ vars.TENNISAPI_RAPIDAPI_HOST || 'tennisapi1.p.rapidapi.com' }}
  TENNISAPI_H2H_RAPIDAPI_HOST: ${{ vars.TENNISAPI_H2H_RAPIDAPI_HOST || 'tennis-api-atp-wta-itf.p.rapidapi.com' }}
  TENNISAPI_H2H_STATS_ENABLED: "1"
  TENNISAPI_H2H_NAME_FALLBACK_ENABLED: "1"
  TENNISAPI_MAX_RPS: "4"
  TENNISAPI_ODDS_PROVIDER_IDS: ${{ vars.TENNISAPI_ODDS_PROVIDER_IDS || '1' }}
  LUCQ_MIN_SAMPLE: "3"
  LUCQ_TOP_LIMIT: "10"

jobs:
  update-lucq:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build LucQ API PRO data
        env:
          LUCQ_BETTING_DAY: ${{ inputs.betting_day || github.event.client_payload.betting_day || '' }}
          LUCQ_OVERWRITE_SNAPSHOT: ${{ inputs.overwrite_snapshot || github.event.client_payload.overwrite_snapshot || 'false' }}
        run: |
          set -euo pipefail
          python -m lucq.engine

      - name: Validate LucQ outputs
        run: |
          set -euo pipefail
          test -f outputs/lucq/latest.json
          test -f outputs/lucq/latest_top10.json
          test -f outputs/lucq/latest_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("latest.json", "latest_top10.json", "latest_manifest.json"):
              json.loads((Path("outputs/lucq") / name).read_text(encoding="utf-8"))
          print("LucQ outputs valid")
          PY

      - name: Render web
        run: python corq/web/render.py

      - name: Commit LucQ outputs and rendered site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/lucq corq/site
          if git diff --cached --quiet; then
            echo "No LucQ changes to commit."
            exit 0
          fi
          git commit -m "Update LucQ API PRO data"
          git pull --rebase origin main
          git push origin HEAD:main
