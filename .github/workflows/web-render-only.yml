name: Web Render Only

on:
  workflow_dispatch:
    inputs:
      commit_site:
        description: "Commit generated corq/site back to repository"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      deploy_pages:
        description: "Deploy rendered site to GitHub Pages"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
  push:
    branches: [main]
    paths:
      - "blinq/**"
      - "corq/web/**"
      - "corq/messages.py"
      - "corq/web/paths.py"
      - "thinq/data/players/**"
      - "thinq/data/rankings/**"
      - "tools/build_player_registry.py"
      - ".github/workflows/web-render-only.yml"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"
  TENNISAPI_ATTACH_RANKINGS: "0"
  CORQ_RENDER_ENABLE_LOGS: "0"

concurrency:
  group: web-render-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-web:
    name: Render web only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          test ! -f requirements.txt || python -m pip install -r requirements.txt

      - name: Build merged registry and render
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python tools/build_player_registry.py
          python -m corq.web.render
          python -m blinq.web.render --output corq/site/h4v34n1c3d4y191/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path("thinq/data/players/player_registry.json").read_text(encoding="utf-8"))
          assert registry.get("version") == "PLAYER_REGISTRY_V3_API_ELO_MERGED"
          html = Path("corq/site/h4v34n1c3d4y191/index.html").read_text(encoding="utf-8")
          assert "Advanced tennis intelligence built from PRO API data" in html
          assert "https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/blinq/predict" in html
          print({"version": registry.get("version"), "ranked": registry.get("api_rank_player_count")})
          PY

      - name: Commit generated registry and site
        if: github.event_name == 'push' || inputs.commit_site == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thinq/data/players/player_registry.json thinq/data/players/elo_player_universe.json thinq/data/players/player_registry_manifest.json thinq/data/players/tennis_name_alias_database.json runtime/players/player_registry_report.json corq/site
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: refresh merged player registry and web"
            git push
          fi

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || inputs.deploy_pages == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' || inputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: corq/site

      - name: Deploy GitHub Pages
        if: github.event_name == 'push' || inputs.deploy_pages == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
