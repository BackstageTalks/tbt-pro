name: Web Render Only

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy rendered site to GitHub Pages
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-render-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  TENNISAPI_ATTACH_RANKINGS: "0"
  CORQ_RENDER_ENABLE_LOGS: "0"

jobs:
  render-and-deploy:
    name: Render manual GitHub Pages backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render BlinQ backup page
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m blinq.web.render --output corq/site/follow-the-data/index.html

      - name: Create legacy redirect
        run: |
          mkdir -p corq/site/blinq-portal-k7m3q9
          cat > corq/site/blinq-portal-k7m3q9/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../follow-the-data/"><link rel="canonical" href="../follow-the-data/"></head><body><a href="../follow-the-data/">Continue to BlinQ</a></body></html>
          HTML

      - name: Validate stable BlinQ markers
        run: |
          test -s corq/site/follow-the-data/index.html
          grep -Fq "Welcome to BlinQ" corq/site/follow-the-data/index.html
          grep -Fq "/follow-the-data/" corq/site/follow-the-data/index.html
          grep -Fq "New accounts receive 10 free predictions" corq/site/follow-the-data/index.html

      - name: Upload GitHub Pages artifact
        if: inputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: corq/site

      - name: Deploy GitHub Pages backup
        if: inputs.deploy_pages == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
