name: Web Render Only

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy BlinQ fallback to GitHub Pages
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-blinq-fallback
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  TENNISAPI_ATTACH_RANKINGS: "0"
  CORQ_RENDER_ENABLE_LOGS: "0"

jobs:
  render-and-deploy:
    name: Render BlinQ fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          test ! -f requirements.txt || python -m pip install -r requirements.txt

      - name: Build player registry
        run: |
          set -euo pipefail
          python tools/build_player_registry.py
          test -s thinq/data/players/player_registry.json

      - name: Render isolated BlinQ artifact
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "SUPABASE_ANON_KEY or SUPABASE_PUBLISHABLE_KEY is missing"; exit 1; }
          test -s blinq/web/assets/blinq_logo.svg || test -s blinq/web/assets/blinq_logo.png
          test -s blinq/web/assets/blinq_background.jpg
          rm -rf pages-artifact
          mkdir -p pages-artifact/follow-the-data pages-artifact/blinq-portal-k7m3q9
          python -m blinq.web.render --output pages-artifact/follow-the-data/index.html
          python - <<'PY2'
          from pathlib import Path

          root = Path("pages-artifact")
          target = "/tbt-pro/follow-the-data/"
          redirect = (
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              f'<meta http-equiv="refresh" content="0;url={target}">'
              f'<link rel="canonical" href="{target}"><title>Redirecting</title>'
              f'</head><body><a href="{target}">Continue to BlinQ</a></body></html>'
          )
          (root / "index.html").write_text(redirect, encoding="utf-8")
          (root / "blinq-portal-k7m3q9" / "index.html").write_text(redirect, encoding="utf-8")
          (root / ".nojekyll").write_text("", encoding="utf-8")
          PY2

      - name: Validate BlinQ fallback
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path

          page_path = Path("pages-artifact/follow-the-data/index.html")
          page = page_path.read_text(encoding="utf-8")
          required = (
              'id="signedOut"',
              'id="signIn"',
              'id="signUp"',
              'id="forgotPassword"',
              'id="updatePassword"',
              'id="historySection"',
              "/api/blinq/predict",
          )
          missing = [marker for marker in required if marker not in page]
          if missing:
              raise SystemExit(f"BlinQ fallback is missing stable markers: {missing}")
          if '<header class="topbar">' in page:
              raise SystemExit("Removed top navigation is present")
          unexpected = [p.as_posix() for p in Path("pages-artifact").rglob("index.html") if p.parent.name.startswith("h4v")]
          if unexpected:
              raise SystemExit(f"CorQ pages entered isolated artifact: {unexpected}")
          print({"page": str(page_path), "bytes": page_path.stat().st_size})
          PY2

      - name: Configure GitHub Pages
        if: inputs.deploy_pages == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: inputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy GitHub Pages
        if: inputs.deploy_pages == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
