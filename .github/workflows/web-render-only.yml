name: Web Render Only

on:
  workflow_dispatch:
    inputs:
      commit_site:
        description: "Commit generated corq/site back to repository"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      deploy_pages:
        description: "Deploy rendered site to GitHub Pages"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
    paths:
      - "corq/web/**"
      - "corq/messages.py"
      - "corq/web/paths.py"
      - ".github/workflows/web-render-only.yml"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"
  TENNISAPI_ATTACH_RANKINGS: "0"
  CORQ_RENDER_ENABLE_LOGS: "0"

concurrency:
  group: web-render-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-web:
    name: Render web only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas lxml html5lib beautifulsoup4 requests

      - name: Render web site from existing outputs
        run: |
          set -euo pipefail
          python -m corq.web.render

      - name: Verify rendered site
        run: |
          set -euo pipefail
          echo "[verify] pwd=$(pwd)"
          echo "[verify] corq/site tree preview"
          find corq/site -maxdepth 3 -type f | sort | sed -n '1,120p' || true
          python - <<'PY'
          from pathlib import Path
          try:
              from corq.web.paths import TOP7_PATH, ALL_PATH, RESULTS_PATH, CLOQ_PATH, THINQ_PATH
          except Exception:
              TOP7_PATH = "h4v34n1c3d4y180"
              CLOQ_PATH = "h4v34n1c3d4y181"
              ALL_PATH = "h4v34n1c3d4y182"
              RESULTS_PATH = "h4v34n1c3d4y183"
              THINQ_PATH = "h4v34n1c3d4y186"
          required = [
              Path("corq/site/index.html"),
              Path("corq/site") / TOP7_PATH / "index.html",
              Path("corq/site") / ALL_PATH / "index.html",
              Path("corq/site") / RESULTS_PATH / "index.html",
              Path("corq/site") / CLOQ_PATH / "index.html",
              Path("corq/site/history/index.html"),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              print("[verify] missing required files:")
              for item in missing:
                  print(" -", item)
              raise SystemExit(1)
          print("[verify] required site files exist")
          PY

      - name: Inspect generated site before cleanup
        run: |
          set -euo pipefail
          echo "[site] top-level size"
          du -sh corq/site || true
          echo "[site] file count"
          find corq/site -type f | wc -l || true
          echo "[site] largest files before cleanup"
          find corq/site -type f -printf '%s %p\n' | sort -nr | head -30 || true

      - name: Keep Pages artifact small
        run: |
          set -euo pipefail
          rm -rf corq/site/logs || true
          find corq/site -type f \( -name "*.log" -o -name "*.tmp" -o -name "*.bak" \) -delete || true
          find corq/site -type f -name "*.json" -size +5M -print -delete || true
          find corq/site -type f -size +95M -print -delete || true
          echo "[site] size after cleanup"
          du -sh corq/site || true
          echo "[site] largest files after cleanup"
          find corq/site -type f -printf '%s %p\n' | sort -nr | head -30 || true

      - name: Commit rendered site
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_site == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corq/site
          if git diff --cached --quiet; then
            echo "No corq/site changes to commit."
          else
            git commit -m "Render web site"
            git push
          fi

      - name: Configure Pages
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_pages == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_pages == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: corq/site

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_pages == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 20
