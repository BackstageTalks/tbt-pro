name: Web Render Only

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy rendered site to GitHub Pages
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-render-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  TENNISAPI_ATTACH_RANKINGS: "0"
  CORQ_RENDER_ENABLE_LOGS: "0"

jobs:
  render-and-deploy:
    name: Render and deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Validate render sources
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/build_player_registry.py
          test -s corq/web/render.py
          test -s corq/web/paths.py
          test -s blinq/web/render.py
          test -s blinq/web/assets/blinq_logo.svg || test -s blinq/web/assets/blinq_logo.png
          test -s blinq/web/assets/blinq_background.jpg
          python -m py_compile \
            tools/build_player_registry.py \
            corq/web/render.py \
            corq/web/paths.py \
            blinq/web/render.py

      - name: Build registry and all GitHub Pages
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "SUPABASE_ANON_KEY or SUPABASE_PUBLISHABLE_KEY is missing"; exit 1; }

          python tools/build_player_registry.py

          # Rebuild the original CorQ, Audit, Results, ThinQ, CloQ and LucQ pages.
          python -m corq.web.render

          # Add the current BlinQ portal without replacing any original page.
          mkdir -p corq/site/follow-the-data
          python -m blinq.web.render \
            --output corq/site/follow-the-data/index.html

          # Preserve legacy BlinQ URLs as redirects only.
          python - <<'PY'
          from pathlib import Path

          target = "/tbt-pro/follow-the-data/"
          redirect = (
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              f'<meta http-equiv="refresh" content="0;url={target}">'
              f'<link rel="canonical" href="{target}">'
              '<title>Redirecting to BlinQ</title></head>'
              f'<body><p><a href="{target}">Continue to BlinQ</a></p>'
              f'<script>location.replace({target!r});</script></body></html>'
          )
          for old_path in ("blinq-portal-k7m3q9", "h4v34n1c3d4y191"):
              path = Path("corq/site") / old_path / "index.html"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(redirect, encoding="utf-8")
          PY

      - name: Validate original pages and BlinQ
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path("thinq/data/players/player_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          players = registry.get("players") or []
          if registry.get("version") != "PLAYER_REGISTRY_V3_API_ELO_MERGED":
              raise SystemExit(f"Unexpected registry version: {registry.get('version')}")
          if not players:
              raise SystemExit("Merged player registry is empty")

          # Stable original GitHub Pages contracts from corq/web/paths.py.
          required_files = (
              "corq/site/index.html",
              "corq/site/h4v34n1c3d4y180/index.html",
              "corq/site/h4v34n1c3d4y181/index.html",
              "corq/site/h4v34n1c3d4y182/index.html",
              "corq/site/h4v34n1c3d4y183/index.html",
              "corq/site/h4v34n1c3d4y186/index.html",
              "corq/site/h4v34n1c3d4y188/index.html",
              "corq/site/h4v34n1c3d4y190/index.html",
              "corq/site/follow-the-data/index.html",
          )
          missing = [path for path in required_files if not Path(path).is_file() or Path(path).stat().st_size == 0]
          if missing:
              raise SystemExit(f"Missing or empty rendered pages: {missing}")

          blinq_path = Path("corq/site/follow-the-data/index.html")
          blinq = blinq_path.read_text(encoding="utf-8")
          required_blinq = (
              'lang="en"',
              "THE PLATFORM",
              "Independent tennis intelligence for data enthusiasts",
              "THE METHOD",
              "Real player data meets transparent model logic",
              "THE PURPOSE",
              "Less guesswork, more edge",
              "Ignore the hype",
              "Follow the data",
              "Player 1",
              "Player 2",
              "Surface",
              "Calculate prediction",
              "Comparison history",
              "/api/blinq/predict",
              "Create account",
              "Forgot password",
              "New accounts receive 10 free successful predictions.",
              "onAuthStateChange((event,session)",
          )
          if not ("data:image/svg+xml;base64," in blinq or "data:image/png;base64," in blinq):
              raise SystemExit("BlinQ page is missing embedded SVG/PNG logo")
          missing_blinq = [item for item in required_blinq if item not in blinq]
          if missing_blinq:
              raise SystemExit(f"BlinQ page is missing required content: {missing_blinq}")

          forbidden_blinq = (
              "Welcome to BlinQ",
              "Data model engine",
              "WHO WE ARE",
              "WHAT WE DO",
              "WHY WE DO IT",
              "Check access status",
              "mix-blend-mode:screen",
              '<header class="topbar">',
              "onAuthStateChange(()=>refreshAuth())",
          )
          present = [item for item in forbidden_blinq if item in blinq]
          if present:
              raise SystemExit(f"BlinQ page contains removed content: {present}")

          print({
              "registry_players": len(players),
              "ranked": registry.get("api_rank_player_count"),
              "validated_pages": len(required_files),
              "blinq_bytes": blinq_path.stat().st_size,
          })
          PY

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf corq/site/logs
          find corq/site -type f \( -name "*.log" -o -name "*.tmp" -o -name "*.bak" -o -name "*.pyc" \) -delete
          find corq/site -type d -name "__pycache__" -prune -exec rm -rf {} +
          test -s corq/site/index.html
          test -s corq/site/follow-the-data/index.html
          du -sh corq/site

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || inputs.deploy_pages == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || inputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: corq/site

      - name: Deploy GitHub Pages
        if: github.event_name == 'push' || inputs.deploy_pages == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
