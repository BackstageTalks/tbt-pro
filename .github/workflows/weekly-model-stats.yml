name: weekly-model-stats

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Rolling window length in betting days"
        required: false
        default: "7"
      from_date:
        description: "Optional explicit start betting day YYYY-MM-DD"
        required: false
        default: ""
      to_date:
        description: "Optional explicit end betting day YYYY-MM-DD"
        required: false
        default: ""
      run_settlement:
        description: "Run results settlement before stats: true/false"
        required: false
        default: "false"
      send_to_telegram:
        description: "Send weekly stats to Telegram: true/false"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: weekly-model-stats
  cancel-in-progress: false

jobs:
  weekly-model-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TGBOT: ${{ secrets.TGBOT }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TELEGRAM_TOP7_CHAT_ID: ${{ secrets.TELEGRAM_TOP7_CHAT_ID }}
      TG_TOP7_CHAT_ID: ${{ secrets.TG_TOP7_CHAT_ID }}
      TGCHID: ${{ secrets.TGCHID }}
      TG_FEED_TIMEZONE: "Europe/Bratislava"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Optional results settlement refresh
        if: ${{ github.event.inputs.run_settlement == 'true' }}
        shell: bash
        run: |
          python -m corq.results_engine.builder \
            --output-root outputs \
            --settle-yesterday \
            --fetch-api \
            --write-all-tg-summaries \
            --local-tz Europe/Bratislava

      - name: Build weekly model stats
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.from_date }}" ] && [ -n "${{ github.event.inputs.to_date }}" ]; then
            EXTRA="--from-date ${{ github.event.inputs.from_date }} --to-date ${{ github.event.inputs.to_date }}"
          fi
          SEND=""
          if [ "${{ github.event.inputs.send_to_telegram }}" = "true" ]; then
            SEND="--send"
          fi
          python -m corq.results_engine.weekly_stats \
            --output-root outputs \
            --days "${{ github.event.inputs.days }}" \
            --local-tz Europe/Bratislava \
            $EXTRA \
            $SEND

      - name: Commit weekly stats artifacts
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/results/latest_weekly_model_stats.json outputs/telegram/latest_weekly_model_stats_message.txt || true
          if git diff --cached --quiet; then
            echo "No weekly stats changes to commit."
          else
            git commit -m "Update weekly model stats"
            git pull --rebase || true
            git push
          fi
