name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "blinq/**"
      - "thinq/**"
      - "tools/build_player_registry.py"
      - "requirements.txt"
      - "supabase/**"
      - ".github/workflows/azure-static-web-apps-agreeable-sky-011a7fe10.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-blinq-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  TENNISAPI_ATTACH_RANKINGS: "0"
  CORQ_RENDER_ENABLE_LOGS: "0"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build and Deploy BlinQ

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          test ! -f requirements.txt || python -m pip install -r requirements.txt
          test ! -f api/requirements.txt || python -m pip install -r api/requirements.txt

      - name: Validate Azure inputs
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "SUPABASE_ANON_KEY is missing"; exit 1; }
          test -s blinq/web/render.py
          test -s blinq/service.py
          test -s api/function_app.py
          test -s api/host.json
          test -s api/requirements.txt
          python -m py_compile blinq/web/render.py blinq/service.py api/function_app.py

      - name: Build player registry
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python tools/build_player_registry.py
          test -s thinq/data/players/player_registry.json
          python - <<'PY2'
          import json
          from pathlib import Path
          payload = json.loads(Path("thinq/data/players/player_registry.json").read_text(encoding="utf-8"))
          rows = payload.get("players", []) if isinstance(payload, dict) else []
          count = len(rows) if isinstance(rows, (list, dict)) else 0
          print(f"BlinQ registry players: {count}")
          if count == 0:
              raise SystemExit("Player registry is empty; refusing BlinQ deploy")
          PY2

      - name: Build minimal BlinQ site
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          rm -rf azure-site
          mkdir -p azure-site/follow-the-data
          python -m blinq.web.render --output azure-site/follow-the-data/index.html

          python - <<'PY'
          from pathlib import Path

          target = "/follow-the-data/"
          redirect = (
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              f'<meta http-equiv="refresh" content="0;url={target}">'
              f'<link rel="canonical" href="{target}">'
              '<title>Redirecting to BlinQ</title></head>'
              f'<body><a href="{target}">Continue to BlinQ</a>'
              f'<script>location.replace({target!r});</script></body></html>'
          )
          for route in ("", "blinq-portal-k7m3q9"):
              path = Path("azure-site") / route / "index.html"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(redirect, encoding="utf-8")
          PY

          cat > azure-site/staticwebapp.config.json <<'JSON'
          {
            "platform": {"apiRuntime": "python:3.11"},
            "globalHeaders": {
              "Cache-Control": "no-store",
              "X-Content-Type-Options": "nosniff",
              "Referrer-Policy": "strict-origin-when-cross-origin"
            },
            "navigationFallback": {
              "rewrite": "/index.html",
              "exclude": ["/api/*", "/.auth/*", "/*.{css,js,png,jpg,jpeg,webp,svg,ico,json}"]
            }
          }
          JSON

      - name: Validate BlinQ artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s azure-site/index.html
          test -s azure-site/follow-the-data/index.html
          test -s azure-site/blinq-portal-k7m3q9/index.html
          test -s azure-site/staticwebapp.config.json
          grep -Fq "Welcome to BlinQ" azure-site/follow-the-data/index.html
          grep -Fq "New accounts receive 10 free predictions" azure-site/follow-the-data/index.html
          grep -Fq "/api/blinq/predict" azure-site/follow-the-data/index.html
          if grep -Fq "__SUPABASE_" azure-site/follow-the-data/index.html; then
            echo "Unresolved Supabase placeholder"
            exit 1
          fi
          size=$(du -sb azure-site | awk '{print $1}')
          echo "Azure static artifact bytes: $size"
          test "$size" -le 25000000

      - name: Prepare managed Python API
        shell: bash
        run: |
          set -euo pipefail
          rm -rf api/blinq api/thinq api/corq
          cp -R blinq api/blinq
          cp -R thinq api/thinq
          test ! -d corq || cp -R corq api/corq
          rm -rf api/blinq/web api/corq/site api/corq/outputs api/corq/logs api/thinq/outputs
          find api -type d -name "__pycache__" -prune -exec rm -rf {} +
          find api -type f \( -name "*.pyc" -o -name "*.log" -o -name "*.tmp" -o -name "*.bak" \) -delete
          python -m py_compile api/function_app.py api/blinq/service.py
          grep -Fq "INVALID_SESSION_" api/function_app.py
          grep -Fq "bonus_credits" api/function_app.py
          grep -Fq "PRO_PLUS_ACTIVE" api/function_app.py
          size=$(du -sb api | awk '{print $1}')
          echo "Azure API artifact bytes: $size"
          test "$size" -le 100000000

      - name: Deploy BlinQ to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: azure-site
          api_location: api
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          action: close
