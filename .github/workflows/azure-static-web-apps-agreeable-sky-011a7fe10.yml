name: Azure Static Web Apps CI/CD
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["api/**", "blinq/**", "thinq/**", "tools/build_player_registry.py", "requirements.txt", ".github/workflows/azure-static-web-apps-agreeable-sky-011a7fe10.yml"]
permissions:
  contents: read
concurrency:
  group: azure-blinq-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          test ! -f requirements.txt || python -m pip install -r requirements.txt
          test ! -f api/requirements.txt || python -m pip install -r api/requirements.txt
      - name: Validate source contracts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_ANON_KEY:-}"
          test -s blinq/web/render.py
          test -s blinq/service.py
          test -s api/function_app.py
          test -s api/host.json
          test -s api/requirements.txt
          python -m py_compile blinq/web/render.py blinq/service.py api/function_app.py
      - name: Build player registry
        run: |
          set -euo pipefail
          python tools/build_player_registry.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("thinq/data/players/player_registry.json").read_text())
          rows=data.get("players",[]) if isinstance(data,dict) else []
          count=len(rows) if isinstance(rows,(list,dict)) else 0
          if count < 100: raise SystemExit(f"Registry too small: {count}")
          print(f"BlinQ registry players: {count}")
          PY
      - name: Build isolated BlinQ site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BLINQ_PRO_PAYMENT_URL: ${{ vars.BLINQ_PRO_PAYMENT_URL }}
          BLINQ_PRO_PLUS_PAYMENT_URL: ${{ vars.BLINQ_PRO_PLUS_PAYMENT_URL }}
        run: |
          set -euo pipefail
          rm -rf azure-site
          mkdir -p azure-site/follow-the-data azure-site/blinq-portal-k7m3q9
          python -m blinq.web.render --output azure-site/follow-the-data/index.html
          printf '%s' '<!doctype html><meta http-equiv="refresh" content="0;url=/follow-the-data/"><a href="/follow-the-data/">Continue</a>' > azure-site/index.html
          cp azure-site/index.html azure-site/blinq-portal-k7m3q9/index.html
          cat > azure-site/staticwebapp.config.json <<'JSON'
          {"platform":{"apiRuntime":"python:3.11"},"globalHeaders":{"Cache-Control":"no-store","X-Content-Type-Options":"nosniff"},"navigationFallback":{"rewrite":"/index.html","exclude":["/api/*","/.auth/*","/*.{css,js,png,jpg,jpeg,webp,svg,ico,json}"]}}
          JSON
      - name: Validate built site contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=set()
              def handle_starttag(self,tag,attrs):
                  value=dict(attrs).get("id")
                  if value: self.ids.add(value)
          text=Path("azure-site/follow-the-data/index.html").read_text()
          p=P(); p.feed(text)
          required={"signIn","signOut","p1","p2","surface","run","planBadge","planDetail","upgrade","upgradeModal","proPayment","proPlusPayment","closeUpgrade"}
          missing=required-p.ids
          if missing: raise SystemExit(f"Missing ids: {sorted(missing)}")
          if "__SUPABASE_" in text or "__PRO_PAYMENT_URL__" in text: raise SystemExit("Unresolved placeholder")
          PY
          test "$(du -sb azure-site | awk '{print $1}')" -le 25000000
      - name: Prepare managed API
        run: |
          set -euo pipefail
          rm -rf api/blinq api/thinq api/corq
          cp -R blinq api/blinq
          cp -R thinq api/thinq
          test ! -d corq || cp -R corq api/corq
          rm -rf api/blinq/web api/corq/site api/corq/outputs api/corq/logs api/thinq/outputs
          find api -type d -name __pycache__ -prune -exec rm -rf {} +
          python -m py_compile api/function_app.py api/blinq/service.py
          test "$(du -sb api | awk '{print $1}')" -le 100000000
      - name: Deploy BlinQ
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: azure-site
          api_location: api
          output_location: ""
          skip_app_build: true
