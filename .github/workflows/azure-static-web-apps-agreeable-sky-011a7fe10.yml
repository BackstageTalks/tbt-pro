name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "blinq/**"
      - "corq/web/**"
      - "corq/messages.py"
      - "corq/web/paths.py"
      - "thinq/**"
      - "outputs/**"
      - "requirements.txt"
      - ".github/workflows/azure-static-web-apps-agreeable-sky-011a7fe10.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-static-web-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build and Deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f api/requirements.txt ]; then
            python -m pip install -r api/requirements.txt
          fi

      - name: Render shared web site
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
          TENNISAPI_ATTACH_RANKINGS: "0"
          CORQ_RENDER_ENABLE_LOGS: "0"
        run: |
          set -euo pipefail
          rm -rf corq/site/assets/results_lazy
          mkdir -p corq/site/assets/results_lazy
          python -m corq.web.render
          python -m blinq.web.render --output corq/site/h4v34n1c3d4y191/index.html

      - name: Configure Static Web Apps runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > corq/site/staticwebapp.config.json <<'JSON'
          {
            "platform": {
              "apiRuntime": "python:3.11"
            },
            "globalHeaders": {
              "X-Content-Type-Options": "nosniff",
              "Referrer-Policy": "strict-origin-when-cross-origin"
            },
            "navigationFallback": {
              "rewrite": "/index.html",
              "exclude": ["/api/*", "/*.xml", "/*.{css,js,png,jpg,jpeg,webp,svg,ico,json}"]
            }
          }
          JSON

      - name: Prepare managed Python API
        shell: bash
        run: |
          set -euo pipefail
          test -s api/function_app.py
          test -s api/host.json
          test -s api/requirements.txt
          rm -rf api/blinq api/thinq api/corq
          cp -R blinq api/blinq
          cp -R thinq api/thinq
          cp -R corq api/corq
          find api -type d -name site -prune -exec rm -rf {} +
          python -m py_compile api/function_app.py api/blinq/service.py

      - name: Validate deployment package
        shell: bash
        run: |
          set -euo pipefail
          test -s corq/site/index.html
          test -s corq/site/h4v34n1c3d4y191/index.html
          test -s corq/site/staticwebapp.config.json
          test -s api/function_app.py
          grep -q "/api/blinq/predict" corq/site/h4v34n1c3d4y191/index.html
          if grep -q "const prob=d" corq/site/h4v34n1c3d4y191/index.html; then
            echo "ELO-only BlinQ JavaScript is still present"
            exit 1
          fi

      - name: Upload Static Web App and managed API
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: corq/site
          api_location: api
          output_location: ""
          skip_app_build: true
          skip_api_build: false

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          action: close
