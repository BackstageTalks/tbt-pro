name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "blinq/**"
      - "corq/web/**"
      - "corq/messages.py"
      - "thinq/**"
      - "tools/build_player_registry.py"
      - "outputs/**"
      - "requirements.txt"
      - "supabase/**"
      - ".github/workflows/azure-static-web-apps-agreeable-sky-011a7fe10.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-static-web-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  TENNISAPI_ATTACH_RANKINGS: "0"
  CORQ_RENDER_ENABLE_LOGS: "0"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build and Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render BlinQ production page
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m blinq.web.render --output corq/site/follow-the-data/index.html

      - name: Create legacy redirect
        run: |
          mkdir -p corq/site/blinq-portal-k7m3q9
          cat > corq/site/blinq-portal-k7m3q9/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/follow-the-data/"><link rel="canonical" href="/follow-the-data/"></head><body><a href="/follow-the-data/">Continue to BlinQ</a></body></html>
          HTML

      - name: Validate stable BlinQ markers
        run: |
          test -s corq/site/follow-the-data/index.html
          grep -Fq "Welcome to BlinQ" corq/site/follow-the-data/index.html
          grep -Fq "SUPABASE_URL" blinq/web/render.py
          grep -Fq "/follow-the-data/" corq/site/follow-the-data/index.html
          grep -Fq "New accounts receive 10 free predictions" corq/site/follow-the-data/index.html

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: corq/site
          api_location: api
          output_location: ""
          skip_app_build: true
          skip_api_build: false

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          action: close
