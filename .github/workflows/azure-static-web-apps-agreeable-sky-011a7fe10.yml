name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "blinq/**"
      - "thinq/**"
      - "tools/build_player_registry.py"
      - "requirements.txt"
      - ".github/workflows/azure-static-web-apps-agreeable-sky-011a7fe10.yml"

permissions:
  contents: read

concurrency:
  group: azure-blinq-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          test ! -f requirements.txt || python -m pip install -r requirements.txt
          test ! -f api/requirements.txt || python -m pip install -r api/requirements.txt

      - name: Validate source contracts
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "SUPABASE_ANON_KEY is missing"; exit 1; }
          test -s blinq/web/render.py
          test -s blinq/web/plans.json
          test -s blinq/service.py
          test -s blinq/loaders/h2h_loader.py
          test -s blinq/features/recent_form.py
          test -s api/function_app.py
          test -s api/host.json
          test -s api/requirements.txt
          python -m py_compile \
            blinq/web/render.py \
            blinq/service.py \
            blinq/model.py \
            blinq/loaders/h2h_loader.py \
            blinq/features/recent_form.py \
            api/function_app.py
          python -c "from blinq.service import BlinqService; assert BlinqService"

      - name: Validate plans configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path("blinq/web/plans.json").read_text(encoding="utf-8"))
          for key in ("pro", "pro_plus"):
              plan = data.get(key)
              if not isinstance(plan, dict):
                  raise SystemExit(f"Missing plan: {key}")
              if not isinstance(plan.get("enabled"), bool):
                  raise SystemExit(f"Invalid enabled flag: {key}")
              if plan["enabled"]:
                  parsed = urlparse(str(plan.get("url") or ""))
                  if parsed.scheme != "https" or not parsed.netloc:
                      raise SystemExit(f"Invalid HTTPS URL: {key}")
          print("Plans contract passed")
          PY

      - name: Build player registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_player_registry.py
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("thinq/data/players/player_registry.json").read_text(encoding="utf-8"))
          rows = data.get("players", []) if isinstance(data, dict) else []
          count = len(rows) if isinstance(rows, (list, dict)) else 0
          if count < 100:
              raise SystemExit(f"Registry too small: {count}")
          print(f"BlinQ registry players: {count}")
          PY

      - name: Build isolated BlinQ site
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          rm -rf azure-site
          mkdir -p azure-site/follow-the-data azure-site/blinq-portal-k7m3q9
          python -m blinq.web.render --output azure-site/follow-the-data/index.html
          printf '%s' '<!doctype html><meta http-equiv="refresh" content="0;url=/follow-the-data/"><a href="/follow-the-data/">Continue</a>' > azure-site/index.html
          cp azure-site/index.html azure-site/blinq-portal-k7m3q9/index.html
          cat > azure-site/staticwebapp.config.json <<'JSON'
          {"platform":{"apiRuntime":"python:3.11"},"globalHeaders":{"Cache-Control":"no-store","X-Content-Type-Options":"nosniff"},"navigationFallback":{"rewrite":"/index.html","exclude":["/api/*","/.auth/*","/*.{css,js,png,jpg,jpeg,webp,svg,ico,json}"]}}
          JSON

      - name: Validate built site contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  value = dict(attrs).get("id")
                  if value:
                      self.ids.add(value)

          text = Path("azure-site/follow-the-data/index.html").read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(text)
          required = {
              "signUpNickname", "signIn", "signUp", "signOut", "p1", "p2",
              "surface", "run", "upgradeOpen", "upgradeModal", "upgradeClose", "planGrid"
          }
          missing = sorted(required - parser.ids)
          if missing:
              raise SystemExit(f"Missing frontend ids: {missing}")
          if "__SUPABASE_" in text or "__PLAN_CONFIG__" in text:
              raise SystemExit("Unresolved frontend placeholder")
          print("Frontend contract passed")
          PY
          size=$(du -sb azure-site | awk '{print $1}')
          echo "Azure static artifact bytes: $size"
          test "$size" -le 25000000

      - name: Prepare managed API
        shell: bash
        run: |
          set -euo pipefail
          rm -rf api/blinq api/thinq api/corq
          cp -R blinq api/blinq
          cp -R thinq api/thinq
          test ! -d corq || cp -R corq api/corq

          rm -rf \
            api/blinq/web \
            api/corq/site \
            api/corq/outputs \
            api/corq/logs \
            api/thinq/outputs

          python - <<'PY'
          import json
          from pathlib import Path

          cache_dir = Path("api/blinq/data/form/previous_matches")
          kept_fields = {
              "id", "customId", "startTimestamp", "status", "winnerCode",
              "homeTeam", "awayTeam", "groundType", "tournament", "eventFilters"
          }
          team_fields = {"id", "name", "shortName", "playerTeamInfo"}
          tournament_fields = {"groundType", "uniqueTournament"}
          unique_fields = {"groundType"}

          def compact_team(value):
              if not isinstance(value, dict):
                  return {}
              return {key: value[key] for key in team_fields if key in value}

          def compact_tournament(value):
              if not isinstance(value, dict):
                  return {}
              output = {key: value[key] for key in tournament_fields if key in value}
              unique = output.get("uniqueTournament")
              if isinstance(unique, dict):
                  output["uniqueTournament"] = {
                      key: unique[key] for key in unique_fields if key in unique
                  }
              return output

          files = sorted(cache_dir.glob("*.json")) if cache_dir.is_dir() else []
          if not files:
              raise SystemExit("No verified BlinQ previous-match cache files found")

          valid_files = 0
          total_events = 0
          for path in files:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict) or payload.get("status") != "OK":
                  raise SystemExit(f"Invalid match cache object: {path}")
              events = payload.get("events")
              if not isinstance(events, list):
                  raise SystemExit(f"Invalid events list: {path}")

              compact_events = []
              for event in events:
                  if not isinstance(event, dict):
                      continue
                  compact = {key: event[key] for key in kept_fields if key in event}
                  compact["homeTeam"] = compact_team(event.get("homeTeam"))
                  compact["awayTeam"] = compact_team(event.get("awayTeam"))
                  compact["tournament"] = compact_tournament(event.get("tournament"))
                  compact_events.append(compact)

              compact_payload = {
                  "status": "OK",
                  "events": compact_events,
                  "has_next_page": bool(payload.get("has_next_page")),
                  "page": payload.get("page"),
                  "player_id": payload.get("player_id"),
                  "saved_at": payload.get("saved_at"),
                  "saved_at_iso": payload.get("saved_at_iso"),
                  "source": payload.get("source"),
              }
              path.write_text(
                  json.dumps(compact_payload, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
              valid_files += 1
              total_events += len(compact_events)

          print(f"Compacted match cache files={valid_files} events={total_events}")
          PY

          find api -type d -name "__pycache__" -prune -exec rm -rf {} +
          find api -type f -name "*.pyc" -delete

          python -m py_compile \
            api/function_app.py \
            api/blinq/service.py \
            api/blinq/model.py \
            api/blinq/loaders/h2h_loader.py \
            api/blinq/features/recent_form.py
          python -c "import sys; sys.path.insert(0, 'api'); from blinq.service import BlinqService; assert BlinqService"

          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("api/blinq/data/form/previous_matches").glob("*.json"))
          if not files:
              raise SystemExit("Compacted cache is missing from API artifact")
          for path in files:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("status") != "OK" or not isinstance(payload.get("events"), list):
                  raise SystemExit(f"Invalid compacted cache: {path}")
          print(f"Validated compacted match cache files: {len(files)}")
          PY

          size=$(du -sb api | awk '{print $1}')
          echo "Azure API artifact bytes: $size"
          test "$size" -le 100000000

      - name: Deploy BlinQ
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: azure-site
          api_location: api
          output_location: ""
          skip_app_build: true
