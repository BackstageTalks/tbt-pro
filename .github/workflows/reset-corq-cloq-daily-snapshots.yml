name: Reset CorQ and CloQ Daily Snapshots

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Betting day to refresh, format YYYY-MM-DD"
        required: true
        type: string
      dry_run:
        description: "Only list files, do not delete"
        required: true
        default: true
        type: boolean
      confirmation:
        description: "For deletion enter RESET YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: reset-corq-cloq-daily-snapshots
  cancel-in-progress: false

jobs:
  reset-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from datetime import date

          raw = os.environ["TARGET_DATE"]
          try:
              parsed = date.fromisoformat(raw)
          except ValueError as exc:
              raise SystemExit(f"Invalid target_date: {exc}")

          if parsed.isoformat() != raw:
              raise SystemExit("target_date must use exact YYYY-MM-DD format")

          print(f"Validated betting day: {raw}")
          PY

          if [ "$DRY_RUN" != "true" ]; then
            expected="RESET $TARGET_DATE"
            if [ "$CONFIRMATION" != "$expected" ]; then
              echo "Deletion blocked. confirmation must be exactly: $expected"
              exit 1
            fi
          fi

      - name: Find and optionally delete CorQ and CloQ snapshot files
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ["TARGET_DATE"]
          dry_run = os.environ["DRY_RUN"].lower() == "true"
          year = target[:4]
          month = target[5:7]

          corq_snapshot = Path(
              f"outputs/snapshots/corq_daily/{year}/{month}/{target}_corq_daily_snapshot.json"
          )
          cloq_root = Path("outputs/cloq")

          date_keys = {
              "date",
              "day",
              "snapshot_date",
              "functional_day",
              "betting_day",
              "run_date",
              "prediction_date",
          }

          def has_target_date(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key in date_keys and str(item)[:10] == target:
                          return True
                      if has_target_date(item):
                          return True
              elif isinstance(value, list):
                  return any(has_target_date(item) for item in value)
              return False

          def cloq_matches(path):
              relative = path.relative_to(cloq_root).as_posix()

              # latest_cloq.json is regenerated automatically and does not block
              # creation of an immutable daily snapshot, so keep it protected.
              if path.name.startswith("latest_"):
                  return False

              if target in relative:
                  return True

              if path.suffix.lower() != ".json":
                  return False

              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  return False

              return has_target_date(payload)

          targets = []

          if corq_snapshot.is_file():
              targets.append(corq_snapshot)

          if cloq_root.is_dir():
              for path in sorted(cloq_root.rglob("*")):
                  if path.is_file() and cloq_matches(path):
                      targets.append(path)

          # Deduplicate while preserving deterministic order.
          targets = sorted(set(targets), key=lambda p: p.as_posix())

          print(f"target_date={target}")
          print(f"dry_run={dry_run}")
          print(f"matched_files={len(targets)}")

          if targets:
              print("Files required to reset the CorQ/CloQ daily snapshot:")
              for path in targets:
                  print(f"  {path.as_posix()}")
          else:
              print("No CorQ or CloQ daily snapshot files found for the date.")

          protected = [
              Path("outputs/latest_all.json"),
              Path("outputs/latest_top7.json"),
              Path("outputs/latest_cloq.json"),
              Path("outputs/cloq/latest_cloq.json"),
              Path("outputs/latest_manifest.json"),
              Path("outputs/snapshots/latest_corq_top7_snapshot.json"),
              Path("outputs/snapshots/latest_corq_top7_snapshot_manifest.json"),
          ]
          print("Protected current runtime files:")
          for path in protected:
              print(f"  {path.as_posix()}")

          report = {
              "target_date": target,
              "dry_run": dry_run,
              "matched_files": [path.as_posix() for path in targets],
              "protected_files": [path.as_posix() for path in protected],
          }
          Path("reset-snapshot-report.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )

          if dry_run:
              print("DRY RUN complete. No files were deleted.")
              raise SystemExit(0)

          for path in targets:
              path.unlink()
              print(f"Deleted: {path.as_posix()}")

          cleanup_roots = [
              Path("outputs/snapshots/corq_daily"),
              Path("outputs/cloq"),
          ]
          for root in cleanup_roots:
              if not root.is_dir():
                  continue
              directories = sorted(
                  (p for p in root.rglob("*") if p.is_dir()),
                  key=lambda p: len(p.parts),
                  reverse=True,
              )
              for directory in directories:
                  try:
                      directory.rmdir()
                      print(f"Removed empty directory: {directory.as_posix()}")
                  except OSError:
                      pass

          print(f"Deleted {len(targets)} CorQ/CloQ snapshot files for {target}.")
          PY

      - name: Upload reset report
        uses: actions/upload-artifact@v4
        with:
          name: reset-corq-cloq-${{ inputs.target_date }}
          path: reset-snapshot-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit snapshot reset
        if: ${{ inputs.dry_run == false }}
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/snapshots/corq_daily outputs/cloq

          if git diff --cached --quiet; then
            echo "No snapshot deletion to commit."
            exit 0
          fi

          git commit -m "Reset CorQ and CloQ snapshots for $TARGET_DATE"

          if git push origin HEAD:main; then
            echo "Snapshot reset pushed successfully."
            exit 0
          fi

          echo "Push rejected. Retrying on latest main."
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN complete for $TARGET_DATE. Check the uploaded report."
          else
            echo "CorQ and CloQ snapshot reset complete for $TARGET_DATE."
            echo "Run Daily Tennis Predictions again to regenerate both models."
          fi
