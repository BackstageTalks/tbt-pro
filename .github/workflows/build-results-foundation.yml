name: Build Results Foundation

on:
  workflow_dispatch:
    inputs:
      fetch_api:
        description: "Fetch TennisApi event details"
        required: false
        default: "true"
      sources:
        description: "Comma separated sources: corq,all,cloq"
        required: false
        default: "corq,all,cloq"
  workflow_run:
    workflows: ["Daily Tennis Predictions"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-results:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build results
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TENNISAPI_RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          FETCH_API="${{ github.event.inputs.fetch_api }}"
          SOURCES="${{ github.event.inputs.sources }}"
          if [ -z "$FETCH_API" ]; then FETCH_API="true"; fi
          if [ -z "$SOURCES" ]; then SOURCES="corq,all,cloq"; fi
          python -m corq.results --output-root outputs --fetch-api "$FETCH_API" --sources "$SOURCES"

      - name: Show results manifest
        run: |
          if [ -f outputs/results/results_manifest.json ]; then cat outputs/results/results_manifest.json; fi

      - name: Commit results outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/results || true
          if git diff --cached --quiet; then
            echo "No results changes to commit"
          else
            git commit -m "Update TBT PRO results outputs"
            git push
          fi
