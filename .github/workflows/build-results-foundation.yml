name: Build Results Foundation

on:
  workflow_dispatch:
    inputs:
      fetch_api:
        description: "Fetch TennisApi event details for results"
        required: false
        default: "true"
  workflow_run:
    workflows: ["Daily Tennis Predictions"]
    types: [completed]

permissions:
  contents: write

jobs:
  build-results:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build results
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          if [ "${{ github.event.inputs.fetch_api || 'true' }}" = "true" ]; then
            python -m corq.results --output-root outputs --fetch-api
          else
            python -m corq.results --output-root outputs
          fi

      - name: Commit results
        run: |
          if [ -n "$(git status --porcelain outputs/results)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add outputs/results
            git commit -m "Build results"
            git push
          else
            echo "No results changes to commit."
          fi
