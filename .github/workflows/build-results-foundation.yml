name: Build Results Foundation

on:
  workflow_dispatch:
  schedule:
    # Around 14:00 Slovakia time during summer time UTC+2
    - cron: "0 12 * * *"
    # Around 19:00 Slovakia time during summer time UTC+2
    - cron: "0 17 * * *"
    # Around 00:00 Slovakia time during summer time UTC+2
    - cron: "0 22 * * *"
    # Around 08:00 Slovakia time during summer time UTC+2
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Results engine layout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          test -f corq/results_engine/__init__.py
          test -f corq/results_engine/common.py
          test -f corq/results_engine/provider.py
          test -f corq/results_engine/builder.py
          test -f corq/results_engine/results.py
          test -f corq/results_engine/results_db.py
          if grep -R "python -m corq.results_db\|python -m corq.results " .github/workflows -n; then
            echo "ERROR: old Results module command still exists in workflows"
            exit 1
          fi
          python - <<'PY'
          import importlib.util
          for name in ["corq.results_engine.results", "corq.results_engine.results_db", "corq.results_engine.builder"]:
              spec = importlib.util.find_spec(name)
              if spec is None:
                  raise SystemExit(f"Missing module: {name}")
              print(f"OK {name} -> {spec.origin}")
          PY

      - name: Build persistent Results database
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m corq.results_engine.results             --output-root outputs             --fetch-api             --settle-yesterday             --local-tz Europe/Bratislava             --settlement-grace-hours 2

      - name: Render web site with updated Results
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m corq.web.render

      - name: Commit Results database and rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/results corq/site
          git commit -m "Update Results database and rendered site" || echo "No result/site changes"
          git push
