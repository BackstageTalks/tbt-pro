name: Project Metrics Report

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:30 Europe/Bratislava-ish.
    - cron: "30 4 * * 1"

permissions:
  contents: write

concurrency:
  group: project-metrics-report
  cancel-in-progress: false

jobs:
  project-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate project metrics report
        run: |
          python tools/project_metrics.py --root . --output-dir outputs/project_metrics

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-metrics-report
          path: outputs/project_metrics/

      - name: Commit metrics report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/project_metrics/project_metrics.json outputs/project_metrics/project_metrics.md

          if git diff --cached --quiet; then
            echo "No metrics changes to commit."
            exit 0
          fi

          git commit -m "Update project metrics report"
          if git push; then
            echo "Metrics report pushed."
            exit 0
          fi

          echo "Push rejected, preserving metrics report and retrying on latest main..."
          tmp_dir="$(mktemp -d)"
          cp -a outputs/project_metrics "$tmp_dir/project_metrics"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p outputs
          rm -rf outputs/project_metrics
          cp -a "$tmp_dir/project_metrics" outputs/project_metrics
          git add outputs/project_metrics/project_metrics.json outputs/project_metrics/project_metrics.md
          if git diff --cached --quiet; then
            echo "No metrics changes after reset."
            exit 0
          fi
          git commit -m "Update project metrics report"
          git push
