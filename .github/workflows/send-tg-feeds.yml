name: send-tg-feeds

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Feed mode"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "picks"
          - "results"
          - "cloq"
          - "cloq-free"
          - "top7"
          - "free"
          - "cloq-results"
          - "corq-results"
      limit:
        description: "CorQ TOP7 limit"
        required: false
        default: "7"
      cloq_limit:
        description: "CloQ TOP limit"
        required: false
        default: "10"
      include_started:
        description: "Include already started matches: true/false"
        required: false
        default: "false"
  repository_dispatch:
    types:
      - send-tg-feeds
      - corq-tg-feeds

permissions:
  contents: write

concurrency:
  group: send-tg-feeds
  cancel-in-progress: false

jobs:
  send-tg-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TGBOT: ${{ secrets.TGBOT }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TELEGRAM_TOP7_CHAT_ID: ${{ secrets.TELEGRAM_TOP7_CHAT_ID }}
      TG_TOP7_CHAT_ID: ${{ secrets.TG_TOP7_CHAT_ID }}
      TELEGRAM_FREE_CHAT_ID: ${{ secrets.TELEGRAM_FREE_CHAT_ID }}
      TG_FREE_CHAT_ID: ${{ secrets.TG_FREE_CHAT_ID }}
      TGCHID: ${{ secrets.TGCHID }}
      TG_FEED_TIMEZONE: "Europe/Bratislava"
      TG_FEED_UPCOMING_ONLY: "true"
      TG_FEED_PAST_GRACE_MINUTES: "0"
      TG_RESULTS_FORCE_REBUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Resolve feed mode
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "null" ]; then
            MODE="${{ github.event.client_payload.mode }}"
          fi
          if [ -z "$MODE" ] || [ "$MODE" = "null" ]; then
            MODE="all"
          fi

          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ] || [ "$LIMIT" = "null" ]; then
            LIMIT="${{ github.event.client_payload.limit }}"
          fi
          if [ -z "$LIMIT" ] || [ "$LIMIT" = "null" ]; then
            LIMIT="7"
          fi

          CLOQ_LIMIT="${{ github.event.inputs.cloq_limit }}"
          if [ -z "$CLOQ_LIMIT" ] || [ "$CLOQ_LIMIT" = "null" ]; then
            CLOQ_LIMIT="${{ github.event.client_payload.cloq_limit }}"
          fi
          if [ -z "$CLOQ_LIMIT" ] || [ "$CLOQ_LIMIT" = "null" ]; then
            CLOQ_LIMIT="10"
          fi

          INCLUDE_STARTED="${{ github.event.inputs.include_started }}"
          if [ -z "$INCLUDE_STARTED" ] || [ "$INCLUDE_STARTED" = "null" ]; then
            INCLUDE_STARTED="${{ github.event.client_payload.include_started }}"
          fi
          if [ -z "$INCLUDE_STARTED" ] || [ "$INCLUDE_STARTED" = "null" ]; then
            INCLUDE_STARTED="false"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "cloq_limit=$CLOQ_LIMIT" >> "$GITHUB_OUTPUT"
          echo "include_started=$INCLUDE_STARTED" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE limit=$LIMIT cloq_limit=$CLOQ_LIMIT include_started=$INCLUDE_STARTED"

      - name: Settle results before Telegram results feed
        if: ${{ steps.mode.outputs.mode == 'all' || steps.mode.outputs.mode == 'results' || steps.mode.outputs.mode == 'corq-results' || steps.mode.outputs.mode == 'cloq-results' }}
        shell: bash
        run: |
          python -m corq.results_engine.builder \
            --output-root outputs \
            --settle-yesterday \
            --fetch-api \
            --write-all-tg-summaries \
            --local-tz Europe/Bratislava

      - name: Send CorQ TOP7 Telegram feed
        if: ${{ steps.mode.outputs.mode == 'all' || steps.mode.outputs.mode == 'picks' || steps.mode.outputs.mode == 'top7' }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.mode.outputs.include_started }}" = "true" ]; then
            EXTRA="--include-started"
          fi
          python -m corq.tg_feed --mode top7 --limit "${{ steps.mode.outputs.limit }}" --send $EXTRA

      - name: Send CloQ Telegram feed
        if: ${{ steps.mode.outputs.mode == 'all' || steps.mode.outputs.mode == 'picks' || steps.mode.outputs.mode == 'cloq' }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.mode.outputs.include_started }}" = "true" ]; then
            EXTRA="--include-started"
          fi
          python -m corq.tg_feed --mode cloq --limit "${{ steps.mode.outputs.cloq_limit }}" --send $EXTRA

      - name: Send FREE Telegram feed
        if: ${{ steps.mode.outputs.mode == 'all' || steps.mode.outputs.mode == 'picks' || steps.mode.outputs.mode == 'free' }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.mode.outputs.include_started }}" = "true" ]; then
            EXTRA="--include-started"
          fi
          python -m corq.tg_feed --mode free --limit "${{ steps.mode.outputs.limit }}" --send $EXTRA

      - name: Send CloQ FREE Telegram feed
        if: ${{ steps.mode.outputs.mode == 'all' || steps.mode.outputs.mode == 'picks' || steps.mode.outputs.mode == 'cloq-free' }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.mode.outputs.include_started }}" = "true" ]; then
            EXTRA="--include-started"
          fi
          python -m corq.tg_feed --mode cloq-free --limit "${{ steps.mode.outputs.cloq_limit }}" --send $EXTRA

      - name: Send CorQ results Telegram feed
        if: ${{ steps.mode.outputs.mode == 'all' || steps.mode.outputs.mode == 'results' || steps.mode.outputs.mode == 'corq-results' }}
        shell: bash
        run: |
          python -m corq.tg_feed --mode corq-results --send

      - name: Send CloQ results Telegram feed
        if: ${{ steps.mode.outputs.mode == 'all' || steps.mode.outputs.mode == 'results' || steps.mode.outputs.mode == 'cloq-results' }}
        shell: bash
        run: |
          python -m corq.tg_feed --mode cloq-results --send

      - name: Commit updated Telegram and results artifacts
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs || true
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update Telegram feed artifacts"
            git pull --rebase || true
            git push
          fi
