name: send-tg-feeds

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Feed mode"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "picks"
          - "results"
          - "cloq"
          - "top7"
          - "free"
          - "cloq-results"
          - "corq-results"
      limit:
        description: "CorQ TOP7 limit"
        required: false
        default: "7"
      cloq_limit:
        description: "CloQ TOP limit"
        required: false
        default: "10"
      include_started:
        description: "Include already started matches: true/false"
        required: false
        default: "false"
  repository_dispatch:
    types:
      - send-tg-feeds
      - corq-tg-feeds

permissions:
  contents: write

concurrency:
  group: send-tg-feeds
  cancel-in-progress: false

jobs:
  send-tg-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve TG mode
        id: tgmode
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode || github.event.client_payload.mode || 'all' }}"
          LIMIT="${{ github.event.inputs.limit || github.event.client_payload.limit || '7' }}"
          CLOQ_LIMIT="${{ github.event.inputs.cloq_limit || github.event.client_payload.cloq_limit || '10' }}"
          INCLUDE_STARTED="${{ github.event.inputs.include_started || github.event.client_payload.include_started || 'false' }}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "limit=${LIMIT}" >> "$GITHUB_OUTPUT"
          echo "cloq_limit=${CLOQ_LIMIT}" >> "$GITHUB_OUTPUT"
          echo "include_started=${INCLUDE_STARTED}" >> "$GITHUB_OUTPUT"
          echo "TG mode=${MODE} limit=${LIMIT} cloq_limit=${CLOQ_LIMIT} include_started=${INCLUDE_STARTED}"

      - name: Prepare output directory
        shell: bash
        run: mkdir -p outputs/telegram

      - name: Send TG feeds
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TGBOT: ${{ secrets.TGBOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TGCHID: ${{ secrets.TGCHID }}
          TELEGRAM_TOP7_CHAT_ID: ${{ secrets.TELEGRAM_TOP7_CHAT_ID }}
          TG_TOP7_CHAT_ID: ${{ secrets.TG_TOP7_CHAT_ID }}
          TELEGRAM_FREE_CHAT_ID: ${{ secrets.TELEGRAM_FREE_CHAT_ID }}
          TG_FREE_CHAT_ID: ${{ secrets.TG_FREE_CHAT_ID }}
          TG_FEED_TIMEZONE: Europe/Bratislava
        run: |
          set -euo pipefail
          MODE="${{ steps.tgmode.outputs.mode }}"
          LIMIT="${{ steps.tgmode.outputs.limit }}"
          CLOQ_LIMIT="${{ steps.tgmode.outputs.cloq_limit }}"
          INCLUDE_STARTED="${{ steps.tgmode.outputs.include_started }}"

          EXTRA_ARGS=()
          if [ "${INCLUDE_STARTED}" = "true" ]; then
            EXTRA_ARGS+=("--include-started")
          fi

          send_mode() {
            local feed_mode="$1"
            local feed_limit="$2"
            echo "[send-tg-feeds] sending mode=${feed_mode} limit=${feed_limit}"
            python -m corq.tg_feed --mode "${feed_mode}" --limit "${feed_limit}" --send "${EXTRA_ARGS[@]}"
          }

          case "${MODE}" in
            all|both)
              # Morning evaluation first, then daily picks.
              send_mode cloq-results "${CLOQ_LIMIT}"
              send_mode results "${LIMIT}"
              send_mode cloq "${CLOQ_LIMIT}"
              send_mode top7 "${LIMIT}"
              send_mode free "${LIMIT}"
              ;;
            picks)
              send_mode cloq "${CLOQ_LIMIT}"
              send_mode top7 "${LIMIT}"
              send_mode free "${LIMIT}"
              ;;
            results)
              send_mode cloq-results "${CLOQ_LIMIT}"
              send_mode results "${LIMIT}"
              ;;
            cloq)
              send_mode cloq "${CLOQ_LIMIT}"
              ;;
            top7)
              send_mode top7 "${LIMIT}"
              ;;
            free)
              send_mode free "${LIMIT}"
              ;;
            cloq-results)
              send_mode cloq-results "${CLOQ_LIMIT}"
              ;;
            corq-results)
              send_mode results "${LIMIT}"
              ;;
            *)
              echo "Unknown mode: ${MODE}" >&2
              exit 2
              ;;
          esac

      - name: Commit generated TG messages if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/telegram || true
          if git diff --cached --quiet; then
            echo "No Telegram message artifacts changed."
          else
            git commit -m "Update Telegram feed messages"
            git push
          fi
