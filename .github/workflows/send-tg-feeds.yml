name: send-tg-feeds

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Feed mode: top7 or free"
        required: false
        default: "top7"
      limit:
        description: "TOP7 limit"
        required: false
        default: "7"
      include_started:
        description: "Include already started matches: true/false"
        required: false
        default: "false"
  # Safe default: one morning TOP7 push. Adjust later if needed.
  schedule:
    # Around 08:30 Slovakia time during summer time UTC+2
    - cron: "30 6 * * *"

permissions:
  contents: write

jobs:
  send-tg-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Telegram preview and send feed
        env:
          # Repository secrets are named TGBOT and TGCHID.
          TGBOT: ${{ secrets.TGBOT }}
          TGCHID: ${{ secrets.TGCHID }}
          # Also map them to the canonical names accepted by tg_feed.py.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TGBOT }}
          TG_BOT_TOKEN: ${{ secrets.TGBOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TGCHID }}
          TG_CHAT_ID: ${{ secrets.TGCHID }}
          TG_TOP7_CHAT_ID: ${{ secrets.TGCHID }}
          TELEGRAM_TOP7_CHAT_ID: ${{ secrets.TGCHID }}
          TG_FEED_TIME_OFFSET_HOURS: "2"
          TG_FEED_PAST_GRACE_MINUTES: "0"
        run: |
          MODE="${{ github.event.inputs.mode || 'top7' }}"
          LIMIT="${{ github.event.inputs.limit || '7' }}"
          INCLUDE_STARTED="${{ github.event.inputs.include_started || 'false' }}"

          CMD="python corq/tg_feed.py --mode ${MODE} --limit ${LIMIT} --send"
          if [ "${INCLUDE_STARTED}" = "true" ]; then
            CMD="${CMD} --include-started"
          fi

          echo "Running: ${CMD}"
          ${CMD}

      - name: Commit Telegram preview message
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/telegram || true
          git commit -m "Update Telegram feed preview" || echo "No Telegram preview changes"
          git push
