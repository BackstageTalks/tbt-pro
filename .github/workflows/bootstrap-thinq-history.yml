name: Bootstrap THINQ History Data

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated years"
        required: false
        default: "2024,2025,2026"
      tours:
        description: "Comma-separated tours"
        required: false
        default: "atp,wta"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap THINQ history
        env:
          THINQ_HISTORY_YEARS: ${{ github.event.inputs.years }}
          THINQ_HISTORY_TOURS: ${{ github.event.inputs.tours }}
        run: |
          python thinq/loaders/bootstrap_history_data.py
      - name: Show history manifest
        run: |
          if [ -f data/history/bootstrap_manifest.json ]; then
            python - <<'PY'
          import json
          p='data/history/bootstrap_manifest.json'
          m=json.load(open(p, encoding='utf-8'))
          print('ok=', m.get('ok'), 'fail=', m.get('fail'))
          for r in m.get('results', [])[:30]:
              print(r.get('status'), r.get('provider'), r.get('tour'), r.get('year'), r.get('path'))
          PY
          fi
      - name: Commit history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No history data changes to commit"
          else
            git commit -m "Bootstrap THINQ history data"
            git push
          fi
