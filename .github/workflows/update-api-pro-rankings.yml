name: Update API PRO Player Rankings

on:
  workflow_dispatch:
    inputs:
      max_players:
        description: "Maximum API player ranking requests"
        required: false
        default: "100"
      ttl_hours:
        description: "Skip cached players newer than this many hours"
        required: false
        default: "24"
      force_refresh:
        description: "Ignore cache freshness"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - update-api-pro-player-rankings

permissions:
  contents: write

concurrency:
  group: update-api-pro-player-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests
          fi

      - name: Validate inputs and registry
        run: |
          set -euo pipefail
          test -n "${RAPIDAPI_KEY}"
          test -s thinq/data/players/player_registry.json
          python -m py_compile tools/update_api_pro_rankings.py

      - name: Update API PRO player rankings
        shell: bash
        run: |
          set -euo pipefail

          MAX_PLAYERS="${{ github.event.inputs.max_players || '100' }}"
          TTL_HOURS="${{ github.event.inputs.ttl_hours || '24' }}"
          FORCE_REFRESH="${{ github.event.inputs.force_refresh || 'false' }}"
          FORCE_ARG=""

          if [ "$FORCE_REFRESH" = "true" ]; then
            FORCE_ARG="--force"
          fi

          python tools/update_api_pro_rankings.py \
            --registry thinq/data/players/player_registry.json \
            --output thinq/data/rankings/api_pro_player_rankings.json \
            --max-players "$MAX_PLAYERS" \
            --ttl-hours "$TTL_HOURS" \
            $FORCE_ARG

      - name: Validate ranking cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("thinq/data/rankings/api_pro_player_rankings.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          players = data.get("players")
          if not isinstance(players, dict) or not players:
              raise SystemExit("API PRO ranking cache is empty")
          bad = [key for key, row in players.items() if not isinstance(row, dict) or not row.get("ranking")]
          if bad:
              raise SystemExit(f"Invalid ranking rows: {bad[:10]}")
          print(f"Valid cached rankings: {len(players)}")
          PY

      - name: Commit ranking cache
        run: |
          set -euo pipefail
          if git diff --quiet -- thinq/data/rankings/api_pro_player_rankings.json; then
            echo "Ranking cache is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thinq/data/rankings/api_pro_player_rankings.json
          git commit -m "Update API PRO player rankings"

          for attempt in 1 2; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = "2" ]; then
              echo "Push failed after retry"
              exit 1
            fi
            sleep 3
          done
