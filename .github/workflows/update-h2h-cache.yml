name: Update H2H Cache

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "H2H cache mode"
        required: false
        type: choice
        options:
          - "lazy-api-pro-only"
        default: "lazy-api-pro-only"
  repository_dispatch:
    types:
      - update-h2h-cache
      - h2h-cache-refresh

permissions:
  contents: read

concurrency:
  group: update-h2h-cache
  cancel-in-progress: false

jobs:
  update-h2h-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Explain H2H cache policy
        run: |
          echo "H2H cache prewarm is disabled."
          echo "Current policy: API PRO only, lazy per-match H2H loading by customId during ThinQ/CorQ enrichment."
          echo "Legacy h2h_loader.py prewarm arguments are intentionally not used:"
          echo "  --prewarm"
          echo "  --outputs-dir"
          echo "  --max-requests"
          echo "  --require-elo"
          echo ""
          echo "This workflow is kept as a compatibility no-op for repository_dispatch/manual triggers."

      - name: Validate no legacy prewarm call in this workflow
        run: |
          set -euo pipefail
          if grep -n -- "--prewarm\|--outputs-dir\|--max-requests\|--require-elo" .github/workflows/update-h2h-cache.yml; then
            echo "Legacy H2H prewarm arguments found in workflow."
            exit 1
          fi
          echo "No legacy H2H prewarm arguments found."
