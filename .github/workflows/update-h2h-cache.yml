name: Update H2H Cache

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "H2H cache mode"
        required: false
        type: choice
        options:
          - "lazy-api-pro-only"
        default: "lazy-api-pro-only"
  repository_dispatch:
    types:
      - update-h2h-cache
      - h2h-cache-refresh

permissions:
  contents: read

concurrency:
  group: update-h2h-cache
  cancel-in-progress: false

jobs:
  update-h2h-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Explain H2H cache policy
        run: |
          echo "H2H cache bulk refresh is disabled."
          echo "Current policy: API PRO only."
          echo "H2H is loaded lazily per match by customId during ThinQ/CorQ enrichment."
          echo "This workflow is kept only for compatibility with manual and repository_dispatch triggers."

      - name: Validate workflow compatibility
        run: |
          set -euo pipefail
          echo "Compatibility workflow is valid."
          echo "No bulk H2H cache refresh command is executed."
