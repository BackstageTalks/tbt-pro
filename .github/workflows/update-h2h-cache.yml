name: Update H2H Cache

on:
  workflow_dispatch:
    inputs:
      outputs_dir:
        description: "Outputs directory to scan for current match rows"
        required: false
        default: "outputs"
      max_requests:
        description: "Maximum API PRO H2H requests in this run"
        required: false
        default: "60"
      require_elo:
        description: "Only prewarm H2H for players in ELO universe"
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
  repository_dispatch:
    types:
      - update-h2h-cache
      - h2h-cache-refresh

permissions:
  contents: write

concurrency:
  group: update-h2h-cache
  cancel-in-progress: false

jobs:
  update-h2h-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      OUTPUTS_DIR: ${{ github.event.inputs.outputs_dir || github.event.client_payload.outputs_dir || 'outputs' }}
      MAX_REQUESTS: ${{ github.event.inputs.max_requests || github.event.client_payload.max_requests || '60' }}
      REQUIRE_ELO: ${{ github.event.inputs.require_elo || github.event.client_payload.require_elo || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas

      - name: Show H2H prewarm configuration
        run: |
          echo "H2H prewarm enabled."
          echo "Source policy: API PRO only."
          echo "outputs_dir=${OUTPUTS_DIR}"
          echo "max_requests=${MAX_REQUESTS}"
          echo "require_elo=${REQUIRE_ELO}"

      - name: Build player registry and ELO universe
        run: |
          python tools/build_player_registry.py

      - name: Prewarm ThinQ H2H cache
        run: |
          python tools/update_h2h_data.py             --outputs-dir "${OUTPUTS_DIR}"             --max-requests "${MAX_REQUESTS}"             --require-elo "${REQUIRE_ELO}"

      - name: Verify H2H outputs
        run: |
          set -euo pipefail
          test -f thinq/data/h2h/h2h_cache.json
          test -f thinq/data/h2h/h2h_manifest.json
          test -f thinq/data/h2h/h2h_matchups.json
          test -f runtime/h2h/h2h_coverage_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('thinq/data/h2h/h2h_manifest.json').read_text(encoding='utf-8'))
          print('h2h_status=', manifest.get('status'))
          print('candidate_pairs=', manifest.get('candidate_pairs'))
          print('attempted=', manifest.get('attempted'))
          print('ok=', manifest.get('ok'))
          print('no_data=', manifest.get('no_data'))
          print('errors=', manifest.get('errors'))
          print('history_status_counts=', manifest.get('history_status_counts'))
          if manifest.get('status') in {'ERROR', 'NO_ELO_UNIVERSE'}:
              raise SystemExit(f"H2H prewarm failed with status={manifest.get('status')}")
          PY

      - name: Commit H2H cache outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thinq/data/players thinq/data/h2h runtime/players runtime/h2h || true
          if git diff --cached --quiet; then
            echo "No H2H cache changes to commit."
            exit 0
          fi
          git commit -m "Update ThinQ H2H cache"
          if git push; then
            echo "H2H cache outputs pushed."
            exit 0
          fi
          echo "Push rejected, rebasing on origin/main and retrying..."
          tmp_dir="$(mktemp -d)"
          cp -a thinq/data/players "$tmp_dir/players" 2>/dev/null || true
          cp -a thinq/data/h2h "$tmp_dir/h2h" 2>/dev/null || true
          cp -a runtime/players "$tmp_dir/runtime_players" 2>/dev/null || true
          cp -a runtime/h2h "$tmp_dir/runtime_h2h" 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p thinq/data runtime
          [ -d "$tmp_dir/players" ] && rm -rf thinq/data/players && cp -a "$tmp_dir/players" thinq/data/players
          [ -d "$tmp_dir/h2h" ] && rm -rf thinq/data/h2h && cp -a "$tmp_dir/h2h" thinq/data/h2h
          [ -d "$tmp_dir/runtime_players" ] && mkdir -p runtime && rm -rf runtime/players && cp -a "$tmp_dir/runtime_players" runtime/players
          [ -d "$tmp_dir/runtime_h2h" ] && mkdir -p runtime && rm -rf runtime/h2h && cp -a "$tmp_dir/runtime_h2h" runtime/h2h
          git add thinq/data/players thinq/data/h2h runtime/players runtime/h2h || true
          if git diff --cached --quiet; then
            echo "No H2H cache changes after reset."
            exit 0
          fi
          git commit -m "Update ThinQ H2H cache"
          git push
