name: Update ELO Data

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force refresh/build ELO cache"
        required: false
        default: "true"
      run_reason:
        description: "Optional audit note"
        required: false
        default: "manual"
  repository_dispatch:
    types:
      - update-elo-data
      - elo-data-refresh

permissions:
  contents: write

concurrency:
  group: update-elo-data
  cancel-in-progress: false

jobs:
  update-elo-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check trigger policy
        id: trigger_policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.getenv("EVENT_NAME", "")
          now = datetime.now(ZoneInfo("Europe/Bratislava"))

          # ELO refresh is controlled by external Cron or manual dispatch only.
          # No internal GitHub schedule and no dependency on TA workflows.
          should_run = event_name in {"workflow_dispatch", "repository_dispatch"}
          reason = "external_cron_or_manual_dispatch" if should_run else f"unsupported_trigger={event_name}"

          print(f"now={now.isoformat()}")
          print(f"event_name={event_name}")
          print(f"trigger_policy=external_cron_or_manual_dispatch")
          print(f"reason={reason}")
          print(f"should_run={'true' if should_run else 'false'}")
          PY

      - name: Stop when trigger is not eligible
        if: ${{ steps.trigger_policy.outputs.should_run != 'true' }}
        run: |
          echo "Skipping ELO update: trigger policy did not allow this run."

      - name: Checkout repository
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas lxml html5lib beautifulsoup4 requests

      - name: Build ELO cache
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          ELO_FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'true' }}
        run: |
          set -euo pipefail
          echo "ELO_FORCE_REFRESH=${ELO_FORCE_REFRESH}"

          run_and_validate() {
            local label="$1"
            shift
            echo "Trying ELO update command: ${label}"
            if "$@"; then
              echo "ELO command succeeded: ${label}"
              return 0
            fi
            echo "ELO command failed: ${label}"
            return 1
          }

          if [ -f tools/update_elo_data.py ]; then
            run_and_validate "tools/update_elo_data.py" python tools/update_elo_data.py
          elif [ -f tools/update-elo-data.py ]; then
            run_and_validate "tools/update-elo-data.py" python tools/update-elo-data.py
          elif [ -f thinq/loaders/elo_loader.py ]; then
            # thinq/loaders/elo_loader.py refreshes the TA ELO cache only with --update.
            # Running it without --update only inspects the existing index and does not refresh data.
            run_and_validate "thinq/loaders/elo_loader.py --update" python thinq/loaders/elo_loader.py --update --output thinq/data/elo/ta_elo_ratings.json
          else
            echo "No known ELO update entrypoint found."
            echo "Expected one of: tools/update_elo_data.py, tools/update-elo-data.py, thinq/loaders/elo_loader.py"
            exit 1
          fi

      - name: Normalize ELO cache aliases
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          root = Path("thinq/data/elo")
          canonical = root / "ta_elo_ratings.json"
          alias = root / "elo_cache.json"
          refresh = root / "elo_last_refresh.json"

          if not canonical.exists():
              raise SystemExit("Canonical ELO cache missing: thinq/data/elo/ta_elo_ratings.json")
          payload = json.loads(canonical.read_text(encoding="utf-8"))
          players = payload.get("players") if isinstance(payload, dict) else None
          if not isinstance(players, dict) or not players:
              raise SystemExit("Canonical ELO cache has no players")

          # Keep elo_cache.json synchronized because the runtime loader discovers
          # both files and sorted discovery can otherwise prefer an older alias.
          alias.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True), encoding="utf-8")

          meta = {
              "generated_at": payload.get("generated_at") or datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "refreshed_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "source": payload.get("source") or "tennis_abstract_elo_ratings",
              "canonical_cache": str(canonical),
              "alias_cache": str(alias),
              "profile_count": payload.get("profile_count") or len(players),
              "stats": payload.get("stats"),
              "errors": payload.get("errors") or [],
          }
          refresh.write_text(json.dumps(meta, ensure_ascii=False, indent=2, sort_keys=True), encoding="utf-8")
          print(f"ELO canonical players={len(players)} generated_at={meta['generated_at']}")
          print(f"Synced {alias}")
          print(f"Wrote {refresh}")
          PY

      - name: Validate ELO cache
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          candidates = [
              Path("thinq/data/elo/elo_cache.json"),
              Path("thinq/data/elo/ta_elo_ratings.json"),
              Path("thinq/data/elo/elo_last_refresh.json"),
          ]
          existing = [p for p in candidates if p.exists()]
          print("ELO cache candidate files:")
          for p in candidates:
              print(f"- {p}: {'FOUND' if p.exists() else 'missing'}")

          # Loader validation is the source of truth for the daily runtime.
          try:
              from thinq.loaders.elo_loader import load_elo_index, build_elo_context
              idx = load_elo_index()
              print("elo_index_size=", len(idx))
              print("elo_context_sample=", build_elo_context("Frances Tiafoe", "Terence Atmane", "Hard"))
              if len(idx) <= 0:
                  raise SystemExit("ELO loader returned an empty index")
          except Exception as exc:
              raise SystemExit(f"ELO validation failed: {exc}")
          PY

      - name: Commit ELO cache
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r --ignore-unmatch data/elo data/elo_index.json outputs/elo thinq/data/elo_index.json 2>/dev/null || true
          git add thinq/data/elo 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No ELO cache changes to commit."
            exit 0
          fi

          git commit -m "Update ELO cache"
          if git push; then
            echo "ELO cache pushed."
            exit 0
          fi

          echo "Push rejected, preserving ELO cache and retrying on latest main..."
          tmp_dir="$(mktemp -d)"
          mkdir -p "$tmp_dir"
          cp -a thinq/data/elo "$tmp_dir/thinq_data_elo" 2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          mkdir -p thinq/data
          [ -d "$tmp_dir/thinq_data_elo" ] && cp -a "$tmp_dir/thinq_data_elo" thinq/data/elo

          git rm -r --ignore-unmatch data/elo data/elo_index.json outputs/elo thinq/data/elo_index.json 2>/dev/null || true
          git add thinq/data/elo 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No ELO cache changes after reset."
            exit 0
          fi

          git commit -m "Update ELO cache"
          git push
