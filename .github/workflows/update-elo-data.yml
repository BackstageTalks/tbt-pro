name: Update ELO Data

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force refresh/build ELO cache"
        required: false
        default: "true"
      run_reason:
        description: "Optional audit note"
        required: false
        default: "manual"
  repository_dispatch:
    types:
      - update-elo-data
      - elo-data-refresh

permissions:
  contents: write

concurrency:
  group: update-elo-data
  cancel-in-progress: false

jobs:
  update-elo-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check trigger policy
        id: trigger_policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.getenv("EVENT_NAME", "")
          now = datetime.now(ZoneInfo("Europe/Bratislava"))

          # ELO refresh is controlled by external Cron or manual dispatch only.
          # No internal GitHub schedule and no dependency on TA workflows.
          should_run = event_name in {"workflow_dispatch", "repository_dispatch"}
          reason = "external_cron_or_manual_dispatch" if should_run else f"unsupported_trigger={event_name}"

          print(f"now={now.isoformat()}")
          print(f"event_name={event_name}")
          print(f"trigger_policy=external_cron_or_manual_dispatch")
          print(f"reason={reason}")
          print(f"should_run={'true' if should_run else 'false'}")
          PY

      - name: Stop when trigger is not eligible
        if: ${{ steps.trigger_policy.outputs.should_run != 'true' }}
        run: |
          echo "Skipping ELO update: trigger policy did not allow this run."

      - name: Checkout repository
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas lxml html5lib beautifulsoup4 requests

      - name: Build ELO cache
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          ELO_FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'true' }}
        run: |
          set -euo pipefail
          echo "ELO_FORCE_REFRESH=${ELO_FORCE_REFRESH}"

          run_and_validate() {
            local label="$1"
            shift
            echo "Trying ELO update command: ${label}"
            if "$@"; then
              echo "ELO command succeeded: ${label}"
              return 0
            fi
            echo "ELO command failed: ${label}"
            return 1
          }

          if [ -f tools/update_elo_data.py ]; then
            run_and_validate "tools/update_elo_data.py" python tools/update_elo_data.py
          elif [ -f tools/update-elo-data.py ]; then
            run_and_validate "tools/update-elo-data.py" python tools/update-elo-data.py
          elif [ -f thinq/loaders/elo_loader.py ]; then
            if python thinq/loaders/elo_loader.py --help >/tmp/elo_help.txt 2>&1; then
              if grep -qi -- "--refresh\|--force" /tmp/elo_help.txt; then
                python thinq/loaders/elo_loader.py --refresh || python thinq/loaders/elo_loader.py --force-refresh || python thinq/loaders/elo_loader.py
              else
                python thinq/loaders/elo_loader.py
              fi
            else
              python thinq/loaders/elo_loader.py
            fi
          else
            echo "No known ELO update entrypoint found."
            echo "Expected one of: tools/update_elo_data.py, tools/update-elo-data.py, thinq/loaders/elo_loader.py"
            exit 1
          fi


      - name: Build ELO players index
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          out_path = Path("thinq/data/elo/elo_players_index.json")
          candidates = [
              Path("thinq/data/elo/ta_elo_ratings.json"),
              Path("thinq/data/elo/elo_cache.json"),
          ]

          def compact(value):
              text = str(value or "").strip().lower()
              return re.sub(r"[^a-z0-9]+", "", text)

          def as_float(value):
              try:
                  if value in (None, "", "N/A", "-"):
                      return None
                  return float(value)
              except Exception:
                  return None

          def iter_records(payload):
              if isinstance(payload, list):
                  for item in payload:
                      if isinstance(item, dict):
                          yield item
              elif isinstance(payload, dict):
                  for key in ("players", "ratings", "items", "data", "records"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          for item in value:
                              if isinstance(item, dict):
                                  yield item
                          return
                      if isinstance(value, dict):
                          for name, item in value.items():
                              if isinstance(item, dict):
                                  row = dict(item)
                                  row.setdefault("player", name)
                                  yield row
                          return
                  # fallback: mapping directly name -> record
                  for name, item in payload.items():
                      if isinstance(item, dict):
                          row = dict(item)
                          row.setdefault("player", name)
                          yield row

          source = None
          records = []
          for path in candidates:
              if not path.exists():
                  continue
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  records = list(iter_records(payload))
                  if records:
                      source = str(path)
                      break
              except Exception as exc:
                  print(f"Failed reading {path}: {exc}")

          players = {}
          rows = []
          for row in records:
              name = row.get("player") or row.get("name") or row.get("player_name")
              if not name:
                  continue
              tour = str(row.get("tour") or row.get("gender") or row.get("category") or "").upper()
              if tour in {"M", "MEN", "ATP"}:
                  tour = "ATP"
              elif tour in {"F", "W", "WOMEN", "WTA"}:
                  tour = "WTA"
              else:
                  tour = tour or "UNKNOWN"
              item = {
                  "name": str(name),
                  "compact_key": compact(name),
                  "tour": tour,
                  "elo": as_float(row.get("elo") or row.get("overall_elo") or row.get("rating")),
                  "hard_elo": as_float(row.get("hard_elo")),
                  "clay_elo": as_float(row.get("clay_elo")),
                  "grass_elo": as_float(row.get("grass_elo")),
                  "h2h_eligible": True,
                  "source": source,
              }
              players[item["compact_key"]] = item
              rows.append(item)

          for tour in sorted({r["tour"] for r in rows}):
              subset = [r for r in rows if r["tour"] == tour]
              for field, rank_field in [
                  ("elo", "elo_rank_tour"),
                  ("hard_elo", "hard_elo_rank_tour"),
                  ("clay_elo", "clay_elo_rank_tour"),
                  ("grass_elo", "grass_elo_rank_tour"),
              ]:
                  ranked = sorted([r for r in subset if r.get(field) is not None], key=lambda x: x[field], reverse=True)
                  for idx, item in enumerate(ranked, start=1):
                      item[rank_field] = idx

          out = {
              "version": "ELO_PLAYERS_INDEX_V1",
              "generated_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "source": source,
              "player_count": len(players),
              "players": players,
          }
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True), encoding="utf-8")
          print(f"Wrote {out_path} players={len(players)} source={source}")
          if not players:
              raise SystemExit("elo_players_index is empty")
          PY

      - name: Validate ELO cache
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          candidates = [
              Path("thinq/data/elo/elo_cache.json"),
              Path("thinq/data/elo/ta_elo_ratings.json"),
              Path("thinq/data/elo/elo_last_refresh.json"),
          ]
          existing = [p for p in candidates if p.exists()]
          print("ELO cache candidate files:")
          for p in candidates:
              print(f"- {p}: {'FOUND' if p.exists() else 'missing'}")

          # Loader validation is the source of truth for the daily runtime.
          try:
              from thinq.loaders.elo_loader import load_elo_index, build_elo_context
              idx = load_elo_index()
              print("elo_index_size=", len(idx))
              print("elo_context_sample=", build_elo_context("Frances Tiafoe", "Terence Atmane", "Hard"))
              if len(idx) <= 0:
                  raise SystemExit("ELO loader returned an empty index")
          except Exception as exc:
              raise SystemExit(f"ELO validation failed: {exc}")
          PY

      - name: Commit ELO cache
        if: ${{ steps.trigger_policy.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r --ignore-unmatch data/elo data/elo_index.json outputs/elo thinq/data/elo_index.json 2>/dev/null || true
          git add thinq/data/elo 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No ELO cache changes to commit."
            exit 0
          fi

          git commit -m "Update ELO cache"
          if git push; then
            echo "ELO cache pushed."
            exit 0
          fi

          echo "Push rejected, preserving ELO cache and retrying on latest main..."
          tmp_dir="$(mktemp -d)"
          mkdir -p "$tmp_dir"
          cp -a thinq/data/elo "$tmp_dir/thinq_data_elo" 2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          mkdir -p thinq/data
          [ -d "$tmp_dir/thinq_data_elo" ] && cp -a "$tmp_dir/thinq_data_elo" thinq/data/elo

          git rm -r --ignore-unmatch data/elo data/elo_index.json outputs/elo thinq/data/elo_index.json 2>/dev/null || true
          git add thinq/data/elo 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No ELO cache changes after reset."
            exit 0
          fi

          git commit -m "Update ELO cache"
          git push
