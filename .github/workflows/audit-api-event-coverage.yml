name: Audit API Event Coverage

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date inside betting day, YYYY-MM-DD; empty = current Europe/Bratislava day"
        required: false
        type: string
  repository_dispatch:
    types:
      - audit-api-event-coverage

permissions:
  contents: read

concurrency:
  group: audit-api-event-coverage
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
      TENNISAPI_RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TENNISAPI_RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
      TENNISAPI_CATEGORY_IDS: "3,6,871"
      TZ: Europe/Bratislava

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required files and secret
        shell: bash
        run: |
          test -f tools/audit_api_event_coverage.py
          test -f corq/corq_rapidapi_client.py
          if [ -z "${RAPIDAPI_KEY:-}" ]; then
            echo "Missing repository secret RAPIDAPI_KEY"
            exit 1
          fi

      - name: Run API event coverage audit
        shell: bash
        run: |
          DATE_ARG=""
          INPUT_DATE="${{ github.event.inputs.date || '' }}"
          DISPATCH_DATE="${{ github.event.client_payload.date || '' }}"
          TARGET_DATE="${INPUT_DATE:-$DISPATCH_DATE}"
          if [ -n "$TARGET_DATE" ]; then
            DATE_ARG="--date $TARGET_DATE"
          fi
          python tools/audit_api_event_coverage.py $DATE_ARG

      - name: Print audit summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("runtime/api/api_event_coverage_audit.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          print("betting_day:", data.get("betting_day"))
          print("window:", data.get("betting_day_start_local"), "->", data.get("betting_day_end_local"))
          print("category_ids:", data.get("category_ids"))
          print("raw_unique_events:", data.get("raw_unique_events"))
          print("singles_in_window:", data.get("singles_in_window"))
          print("reject_counts:", data.get("reject_counts"))
          print("source_event_counts:", data.get("source_event_counts"))
          PY

      - name: Upload API coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: api-event-coverage-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            runtime/api/api_event_coverage_audit.json
            runtime/api/api_all_discovered_events.json
            outputs/lucq/discovered_singles.json
