name: Update TennisApi Rankings Info

on:
  workflow_dispatch:
  schedule:
    # Lightweight ranking refresh before Daily Tennis Predictions.
    # Info-only replacement for the old TA ranking update.
    - cron: "35 2 * * *"

permissions:
  contents: write

concurrency:
  group: update-tennisapi-rankings-info
  cancel-in-progress: false

jobs:
  update-tennisapi-rankings-info:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Fetch TennisApi rankings info
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # Optional override if RapidAPI changes paths.
          # Comma-separated absolute paths, not full URLs.
          # Example: /api/tennis/rankings/atp,/api/tennis/rankings/wta
          TENNISAPI_RANKING_PATHS: ${{ vars.TENNISAPI_RANKING_PATHS }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import unicodedata
          from pathlib import Path
          from typing import Any, Dict, List, Optional

          import requests

          HOST = "tennisapi1.p.rapidapi.com"
          BASE_URL = f"https://{HOST}"
          API_KEY = os.getenv("RAPIDAPI_KEY", "").strip()
          OUT_DIRS = [Path("data/api_pro/rankings"), Path("outputs/rankings")]
          for d in OUT_DIRS:
              d.mkdir(parents=True, exist_ok=True)

          headers = {
              "x-rapidapi-host": HOST,
              "x-rapidapi-key": API_KEY,
              "Content-Type": "application/json",
          }

          # The first paths are the expected TennisApi/Sofa-style ranking paths.
          # Keep overrides in repository variables if the playground path differs.
          env_paths = [p.strip() for p in os.getenv("TENNISAPI_RANKING_PATHS", "").split(",") if p.strip()]
          candidate_paths = env_paths or [
              "/api/tennis/rankings/atp",
              "/api/tennis/rankings/wta",
              "/api/tennis/rankings/type/7",
              "/api/tennis/rankings/type/8",
              "/api/tennis/rankings",
          ]

          def norm_name(value: Any) -> str:
              text = str(value or "").strip().lower()
              text = unicodedata.normalize("NFKD", text)
              text = "".join(ch for ch in text if not unicodedata.combining(ch))
              text = re.sub(r"[^a-z0-9]+", " ", text)
              return " ".join(text.split())

          def to_int(value: Any) -> Optional[int]:
              try:
                  if value in (None, "", "—", "-", "N/A"):
                      return None
                  return int(float(str(value).replace(",", "")))
              except Exception:
                  return None

          def walk_rows(obj: Any) -> List[Dict[str, Any]]:
              out: List[Dict[str, Any]] = []
              if isinstance(obj, dict):
                  for key in ("rankings", "data", "result", "results", "items"):
                      value = obj.get(key)
                      if isinstance(value, (list, dict)):
                          out.extend(walk_rows(value))
                  if any(k in obj for k in ("ranking", "rank", "position", "points", "rankingPoints", "team", "player")):
                      out.append(obj)
              elif isinstance(obj, list):
                  for item in obj:
                      out.extend(walk_rows(item))
              return out

          def row_to_player(row: Dict[str, Any], source_path: str) -> Optional[Dict[str, Any]]:
              team = row.get("team") if isinstance(row.get("team"), dict) else {}
              player = row.get("player") if isinstance(row.get("player"), dict) else {}
              entity = team or player
              name = row.get("name") or row.get("playerName") or row.get("teamName") or entity.get("name") or entity.get("shortName")
              if not name:
                  return None
              rank = to_int(row.get("ranking") or row.get("rank") or row.get("position"))
              points = to_int(row.get("points") or row.get("rankingPoints") or row.get("ranking_points"))
              if rank is None and points is None:
                  return None
              category = row.get("category") if isinstance(row.get("category"), dict) else {}
              return {
                  "name": str(name),
                  "norm_name": norm_name(name),
                  "compact_name": norm_name(name).replace(" ", ""),
                  "rank": rank,
                  "points": points,
                  "team_id": entity.get("id") or row.get("teamId") or row.get("player_id") or row.get("id"),
                  "country": (entity.get("country") or {}).get("name") if isinstance(entity.get("country"), dict) else entity.get("country"),
                  "category": category.get("name") or category.get("slug") or row.get("categoryName"),
                  "source": "TENNISAPI_RANKINGS",
                  "source_path": source_path,
              }

          attempts = []
          players_by_name: Dict[str, Dict[str, Any]] = {}
          raw_payloads = []

          if not API_KEY:
              raise SystemExit("Missing RAPIDAPI_KEY secret")

          for path in candidate_paths:
              url = BASE_URL + path
              try:
                  response = requests.get(url, headers=headers, timeout=30)
                  status = response.status_code
                  payload = None
                  try:
                      payload = response.json() if response.text else None
                  except Exception:
                      payload = {"raw_text": response.text[:500]}
                  rows = walk_rows(payload)
                  useful = 0
                  for row in rows:
                      player = row_to_player(row, source_path=path)
                      if player and player["norm_name"]:
                          players_by_name[player["norm_name"]] = player
                          useful += 1
                  attempts.append({"path": path, "status": status, "row_count": len(rows), "useful_count": useful})
                  if useful:
                      raw_payloads.append({"path": path, "payload": payload})
                  time.sleep(0.25)
              except Exception as exc:
                  attempts.append({"path": path, "status": "ERROR", "error": str(exc), "row_count": 0, "useful_count": 0})

          output = {
              "source": "TENNISAPI_RANKINGS",
              "model_usage": "INFO_ONLY_NO_PROBABILITY_NO_RANKING_SCORE",
              "generated_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "attempts": attempts,
              "player_count": len(players_by_name),
              "players_by_name": players_by_name,
          }

          if len(players_by_name) == 0:
              print(json.dumps(output, indent=2, ensure_ascii=False))
              raise SystemExit("No ranking rows parsed. Set repository variable TENNISAPI_RANKING_PATHS to the exact RapidAPI playground paths.")

          for out_dir in OUT_DIRS:
              (out_dir / "tennisapi_rankings.json").write_text(json.dumps(output, ensure_ascii=False, indent=2), encoding="utf-8")
              (out_dir / "tennisapi_rankings_attempts.json").write_text(json.dumps(attempts, ensure_ascii=False, indent=2), encoding="utf-8")

          print(json.dumps({"player_count": len(players_by_name), "attempts": attempts}, indent=2, ensure_ascii=False))
          PY

      - name: Commit rankings cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update TennisApi rankings info cache"
          file_pattern: |
            data/api_pro/rankings/tennisapi_rankings.json
            data/api_pro/rankings/tennisapi_rankings_attempts.json
            outputs/rankings/tennisapi_rankings.json
            outputs/rankings/tennisapi_rankings_attempts.json
