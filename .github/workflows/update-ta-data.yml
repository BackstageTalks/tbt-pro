name: Update TA Data

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max TA player profiles to refresh. 0 = all discovered players"
        required: false
        default: "650"
      force_refresh:
        description: "Refresh profiles even if cache already has OK record"
        required: false
        type: boolean
        default: false
  schedule:
    # Tuesday 00:05 UTC = approx. 02:05 Slovakia summer time.
    - cron: "5 0 * * 2"

permissions:
  contents: write

jobs:
  update-ta-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pandas lxml beautifulsoup4

      - name: Build TA rankings cache if loader CLI is available
        continue-on-error: true
        run: |
          python -m thinq.loaders.ranking_loader

      - name: Build TA player profile cache
        env:
          TA_PROFILE_LIMIT: ${{ github.event.inputs.limit || '650' }}
          TA_REQUEST_DELAY_SECONDS: "0.35"
        run: |
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
            python -m thinq.loaders.ta_profile_loader --limit "${TA_PROFILE_LIMIT}" --force-refresh
          else
            python -m thinq.loaders.ta_profile_loader --limit "${TA_PROFILE_LIMIT}"
          fi

      - name: Show generated TA files
        run: |
          ls -la thinq/data/rankings || true
          ls -la thinq/data/ta_profiles || true
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('thinq/data/ta_profiles/ta_player_profiles.json')
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              print('TA profiles:', payload.get('profile_count'))
              print('Stats:', payload.get('stats'))
          PY

      - name: Commit TA data cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thinq/data/rankings/ta_rankings.json thinq/data/ta_profiles/ta_player_profiles.json || true
          if git diff --cached --quiet; then
            echo "No TA data changes to commit."
          else
            git commit -m "Update TA data cache"
            git push
          fi
