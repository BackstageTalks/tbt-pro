name: Update TA Data

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "TA profile limit"
        required: false
        default: "650"
      force_refresh:
        description: "Force refresh existing OK TA profiles"
        required: false
        default: "true"
  schedule:
    # One combined Tennis Abstract data run.
    # Order: rankings -> TA profiles -> TA ELO.
    # Daily 04:10 UTC. This is after night ranking availability and before daily predictions.
    - cron: "10 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-ta-data-combined
  cancel-in-progress: false

jobs:
  update-ta-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas lxml html5lib beautifulsoup4

      - name: Update TA rankings cache
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m thinq.loaders.ranking_loader --output thinq/data/rankings/ta_rankings.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("thinq/data/rankings/ta_rankings.json")
          if not path.exists():
              raise SystemExit("TA rankings cache was not created")

          payload = json.loads(path.read_text(encoding="utf-8"))
          print("TA rankings players:", payload.get("player_count"))
          print("TA rankings source updates:", payload.get("source_last_updates"))
          PY

      - name: Build Tennis Abstract profile cache
        env:
          PYTHONPATH: ${{ github.workspace }}
          TA_PROFILE_LIMIT: ${{ github.event.inputs.limit || '650' }}
          TA_FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'true' }}
          TA_REQUEST_DELAY_SECONDS: "0.35"
          TA_REQUEST_TIMEOUT_SECONDS: "25"
        run: |
          echo "TA_PROFILE_LIMIT=${TA_PROFILE_LIMIT}"
          echo "TA_FORCE_REFRESH=${TA_FORCE_REFRESH}"

          if [ "${TA_FORCE_REFRESH}" = "true" ]; then
            python thinq/loaders/ta_profile_loader.py --limit "${TA_PROFILE_LIMIT}" --force-refresh
          else
            python thinq/loaders/ta_profile_loader.py --limit "${TA_PROFILE_LIMIT}"
          fi

      - name: Show TA profile cache summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("thinq/data/ta_profiles/ta_player_profiles.json")
          if not path.exists():
              raise SystemExit("TA profile cache was not created")

          payload = json.loads(path.read_text(encoding="utf-8"))
          players = payload.get("players") if isinstance(payload, dict) else {}
          if not isinstance(players, dict):
              players = {}

          ok = sum(1 for rec in players.values() if isinstance(rec, dict) and rec.get("status") == "OK")
          print(f"TA profiles total={len(players)} ok={ok}")
          print(f"TA profiles generated_at={payload.get('generated_at') if isinstance(payload, dict) else None}")
          PY

      - name: Build Tennis Abstract ELO cache
        env:
          PYTHONPATH: ${{ github.workspace }}
          TA_ELO_REQUEST_TIMEOUT_SECONDS: "25"
          TA_ELO_REQUEST_DELAY_SECONDS: "0.35"
        run: |
          python -m thinq.loaders.elo_loader --update --output thinq/data/elo/ta_elo_ratings.json

      - name: Show TA ELO cache summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("thinq/data/elo/ta_elo_ratings.json")
          if not path.exists():
              raise SystemExit("TA ELO cache was not created")

          payload = json.loads(path.read_text(encoding="utf-8"))
          players = payload.get("players") if isinstance(payload, dict) else {}
          if not isinstance(players, dict):
              players = {}

          print(f"TA ELO players={len(players)} generated_at={payload.get('generated_at')}")
          PY

      - name: Commit combined TA caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            thinq/data/rankings/ta_rankings.json \
            thinq/data/ta_profiles/ta_player_profiles.json \
            thinq/data/elo/ta_elo_ratings.json

          if git diff --cached --quiet; then
            echo "No combined TA data changes to commit."
            exit 0
          fi

          git commit -m "Update combined Tennis Abstract data caches"
          if git push; then
            echo "Combined TA data pushed."
            exit 0
          fi

          echo "Push rejected, preserving combined TA caches and retrying on latest main..."
          tmp_dir="$(mktemp -d)"
          mkdir -p "$tmp_dir/rankings" "$tmp_dir/ta_profiles" "$tmp_dir/elo"
          cp -a thinq/data/rankings/ta_rankings.json "$tmp_dir/rankings/ta_rankings.json" 2>/dev/null || true
          cp -a thinq/data/ta_profiles/ta_player_profiles.json "$tmp_dir/ta_profiles/ta_player_profiles.json" 2>/dev/null || true
          cp -a thinq/data/elo/ta_elo_ratings.json "$tmp_dir/elo/ta_elo_ratings.json" 2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          mkdir -p thinq/data/rankings thinq/data/ta_profiles thinq/data/elo
          [ -f "$tmp_dir/rankings/ta_rankings.json" ] && cp -a "$tmp_dir/rankings/ta_rankings.json" thinq/data/rankings/ta_rankings.json
          [ -f "$tmp_dir/ta_profiles/ta_player_profiles.json" ] && cp -a "$tmp_dir/ta_profiles/ta_player_profiles.json" thinq/data/ta_profiles/ta_player_profiles.json
          [ -f "$tmp_dir/elo/ta_elo_ratings.json" ] && cp -a "$tmp_dir/elo/ta_elo_ratings.json" thinq/data/elo/ta_elo_ratings.json

          git add \
            thinq/data/rankings/ta_rankings.json \
            thinq/data/ta_profiles/ta_player_profiles.json \
            thinq/data/elo/ta_elo_ratings.json

          if git diff --cached --quiet; then
            echo "No combined TA data changes after reset."
            exit 0
          fi

          git commit -m "Update combined Tennis Abstract data caches"
          git push
