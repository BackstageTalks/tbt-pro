name: Update TA Data

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "TA profile limit"
        required: false
        default: "650"
      force_refresh:
        description: "Force refresh existing OK TA profiles"
        required: false
        default: "true"
  schedule:
    - cron: "10 4 * * *"

permissions:
  contents: write

jobs:
  update-ta-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas lxml html5lib beautifulsoup4

      - name: Build Tennis Abstract profile cache
        env:
          TA_PROFILE_LIMIT: ${{ github.event.inputs.limit || '650' }}
          TA_FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'true' }}
          TA_REQUEST_DELAY_SECONDS: "0.35"
          TA_REQUEST_TIMEOUT_SECONDS: "25"
        run: |
          echo "TA_PROFILE_LIMIT=${TA_PROFILE_LIMIT}"
          echo "TA_FORCE_REFRESH=${TA_FORCE_REFRESH}"

          if [ "${TA_FORCE_REFRESH}" = "true" ]; then
            python thinq/loaders/ta_profile_loader.py --limit "${TA_PROFILE_LIMIT}" --force-refresh
          else
            python thinq/loaders/ta_profile_loader.py --limit "${TA_PROFILE_LIMIT}"
          fi

      - name: Show TA cache summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("thinq/data/ta_profiles/ta_player_profiles.json")
          if not path.exists():
              raise SystemExit("TA profile cache was not created")

          payload = json.loads(path.read_text(encoding="utf-8"))
          players = payload.get("players") if isinstance(payload, dict) else {}
          if not isinstance(players, dict):
              players = {}

          ok = sum(1 for rec in players.values() if isinstance(rec, dict) and rec.get("status") == "OK")
          print(f"TA profiles total={len(players)} ok={ok}")
          print(f"generated_at={payload.get('generated_at') if isinstance(payload, dict) else None}")
          PY

      - name: Commit TA profile cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add thinq/data/ta_profiles/ta_player_profiles.json

          if git diff --cached --quiet; then
            echo "No TA data changes to commit."
          else
            git commit -m "Update Tennis Abstract profile cache"
            git push
          fi
