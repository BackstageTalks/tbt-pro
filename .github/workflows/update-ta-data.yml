name: Update TA Profiles

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "TA profile limit for this batch"
        required: false
        default: "1000"
      offset:
        description: "TA profile offset for batch splitting"
        required: false
        default: "0"
      force_refresh:
        description: "Force refresh existing OK TA profiles"
        required: false
        default: "true"
  schedule:
    # Heavy Tennis Abstract profile refresh.
    # 23:00 UTC Mon/Thu = 01:00 Europe/Bratislava Tue/Fri during summer time.
    # In winter this is 00:00 Europe/Bratislava Tue/Fri.
    - cron: "0 23 * * 1,4"

permissions:
  contents: write

concurrency:
  group: update-ta-profiles
  cancel-in-progress: false

jobs:
  update-ta-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas lxml html5lib beautifulsoup4

      - name: Build Tennis Abstract profile cache
        env:
          PYTHONPATH: ${{ github.workspace }}
          TA_PROFILE_LIMIT: ${{ github.event.inputs.limit || '1000' }}
          TA_PROFILE_OFFSET: ${{ github.event.inputs.offset || '0' }}
          TA_FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'true' }}
          TA_REQUEST_DELAY_SECONDS: "0.35"
          TA_REQUEST_TIMEOUT_SECONDS: "25"
        run: |
          echo "TA_PROFILE_LIMIT=${TA_PROFILE_LIMIT}"
          echo "TA_PROFILE_OFFSET=${TA_PROFILE_OFFSET}"
          echo "TA_FORCE_REFRESH=${TA_FORCE_REFRESH}"

          if [ "${TA_FORCE_REFRESH}" = "true" ]; then
            python thinq/loaders/ta_profile_loader.py --limit "${TA_PROFILE_LIMIT}" --offset "${TA_PROFILE_OFFSET}" --force-refresh
          else
            python thinq/loaders/ta_profile_loader.py --limit "${TA_PROFILE_LIMIT}" --offset "${TA_PROFILE_OFFSET}"
          fi

      - name: Show TA profile cache summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("thinq/data/ta_profiles/ta_player_profiles.json")
          if not path.exists():
              raise SystemExit("TA profile cache was not created")

          payload = json.loads(path.read_text(encoding="utf-8"))
          players = payload.get("players") if isinstance(payload, dict) else {}
          if not isinstance(players, dict):
              players = {}

          def has_value(value):
              return value not in (None, "", "N/A", "n/a", "-", "—")

          def find_key(obj, wanted):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if str(key).lower() == wanted.lower() and has_value(value):
                          return value
                      found = find_key(value, wanted)
                      if has_value(found):
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_key(value, wanted)
                      if has_value(found):
                          return found
              return None

          ok = 0
          failed = 0
          modern_ok = 0
          classic_ok = 0
          both_ok = 0
          ace_count = 0
          df_count = 0
          tb_count = 0
          both_ace_df = 0

          for rec in players.values():
              if not isinstance(rec, dict):
                  continue
              if rec.get("status") == "OK":
                  ok += 1
              if rec.get("status") == "FETCH_FAILED":
                  failed += 1
              sources = rec.get("sources") if isinstance(rec.get("sources"), dict) else {}
              if sources.get("modern") == "OK":
                  modern_ok += 1
              if sources.get("classic") == "OK":
                  classic_ok += 1
              if sources.get("modern") == "OK" and sources.get("classic") == "OK":
                  both_ok += 1

              has_ace = find_key(rec, "ace_pct") is not None
              has_df = find_key(rec, "df_pct") is not None
              has_tb = find_key(rec, "tb_pct") is not None
              ace_count += int(has_ace)
              df_count += int(has_df)
              tb_count += int(has_tb)
              both_ace_df += int(has_ace and has_df)

          print("TA PROFILE CACHE SUMMARY")
          print("========================")
          print(f"generated_at: {payload.get('generated_at')}")
          print(f"source: {payload.get('source')}")
          print(f"profile_count field: {payload.get('profile_count')}")
          print(f"limit: {payload.get('limit')}")
          print(f"offset: {payload.get('offset')}")
          print(f"players stored: {len(players)}")
          print(f"status OK: {ok}")
          print(f"status FETCH_FAILED: {failed}")
          print(f"modern OK: {modern_ok}")
          print(f"classic OK: {classic_ok}")
          print(f"modern+classic OK: {both_ok}")
          print(f"with ace_pct: {ace_count}")
          print(f"with df_pct: {df_count}")
          print(f"with tb_pct: {tb_count}")
          print(f"with both ace_pct+df_pct: {both_ace_df}")
          print("stats:", json.dumps(payload.get("stats", {}), ensure_ascii=False, indent=2))
          PY

      - name: Commit TA profile cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add thinq/data/ta_profiles/ta_player_profiles.json

          if git diff --cached --quiet; then
            echo "No TA profile cache changes to commit."
            exit 0
          fi

          git commit -m "Update Tennis Abstract profile cache"
          if git push; then
            echo "TA profile cache pushed."
            exit 0
          fi

          echo "Push rejected, preserving TA profile cache and retrying on latest main..."
          tmp_dir="$(mktemp -d)"
          mkdir -p "$tmp_dir/ta_profiles"
          cp -a thinq/data/ta_profiles/ta_player_profiles.json "$tmp_dir/ta_profiles/ta_player_profiles.json" 2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          mkdir -p thinq/data/ta_profiles
          [ -f "$tmp_dir/ta_profiles/ta_player_profiles.json" ] && cp -a "$tmp_dir/ta_profiles/ta_player_profiles.json" thinq/data/ta_profiles/ta_player_profiles.json

          git add thinq/data/ta_profiles/ta_player_profiles.json

          if git diff --cached --quiet; then
            echo "No TA profile cache changes after reset."
            exit 0
          fi

          git commit -m "Update Tennis Abstract profile cache"
          git push
