name: Update MARQ Internal Odds Snapshots

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "How many days ahead to scan"
        required: false
        default: "6"
      force_refresh:
        description: "Force API refresh"
        required: false
        default: "true"
  schedule:
    # Bratislava summer: 06:00, 12:00, 18:00. Winter is one hour later.
    # The collector stores snapshot_time_utc and hours_to_start, so exact wall-clock
    # time is not used for CLV math.
    - cron: "0 4,10,16 * * *"

permissions:
  contents: write

concurrency:
  group: marq-internal-odds-snapshots
  cancel-in-progress: false

jobs:
  update-odds-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Collect MARQ internal odds snapshots
        env:
          PYTHONPATH: ${{ github.workspace }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '6' }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'true' }}
        run: |
          echo "DAYS_AHEAD=${DAYS_AHEAD}"
          echo "FORCE_REFRESH=${FORCE_REFRESH}"
          if [ "${FORCE_REFRESH}" = "true" ]; then
            python -m marq.odds_snapshots --days-ahead "${DAYS_AHEAD}" --force-refresh
          else
            python -m marq.odds_snapshots --days-ahead "${DAYS_AHEAD}"
          fi

      - name: Show snapshot summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/marq_ai/odds_snapshots/latest.json")
          if not path.exists():
              raise SystemExit("MARQ internal odds latest snapshot was not created")
          payload = json.loads(path.read_text(encoding="utf-8"))
          print("snapshot_count:", payload.get("snapshot_count"))
          print("date_counts:", payload.get("date_counts"))
          print("generated_at_utc:", payload.get("generated_at_utc"))
          PY

      - name: Commit MARQ internal odds snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/marq_ai/odds_snapshots || true

          if git diff --cached --quiet; then
            echo "No MARQ internal odds snapshot changes to commit."
            exit 0
          fi

          git commit -m "Update MARQ internal odds snapshots"
          if git push; then
            echo "MARQ internal odds snapshots pushed."
            exit 0
          fi

          echo "Push rejected, preserving snapshots and retrying on latest main..."
          tmp_dir="$(mktemp -d)"
          mkdir -p "$tmp_dir"
          cp -a data/marq_ai/odds_snapshots "$tmp_dir/odds_snapshots" 2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          mkdir -p data/marq_ai
          rm -rf data/marq_ai/odds_snapshots
          [ -d "$tmp_dir/odds_snapshots" ] && cp -a "$tmp_dir/odds_snapshots" data/marq_ai/odds_snapshots

          git add data/marq_ai/odds_snapshots || true
          if git diff --cached --quiet; then
            echo "No MARQ internal odds snapshot changes after reset."
            exit 0
          fi

          git commit -m "Update MARQ internal odds snapshots"
          git push
