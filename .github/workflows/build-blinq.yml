name: Build BlinQ Output

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-blinq]

permissions:
  contents: write

concurrency:
  group: build-blinq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-blinq:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build BlinQ output
        run: python -m blinq

      - name: Validate BlinQ output
        run: |
          test -s outputs/blinq/latest_blinq.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("outputs/blinq/latest_blinq.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          rows = data.get("rows")
          if not isinstance(rows, list):
              raise SystemExit("BlinQ output has no rows list")
          print(f"Validated BlinQ rows={len(rows)}")
          PY

      - name: Commit BlinQ output
        run: |
          if git diff --quiet -- outputs/blinq/latest_blinq.json; then
            echo "No BlinQ output changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/blinq/latest_blinq.json
          git commit -m "Update BlinQ output"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
