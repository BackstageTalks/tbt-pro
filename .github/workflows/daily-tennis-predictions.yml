name: Daily Tennis Predictions

on:
  workflow_dispatch:
  schedule:
    # Runs at 05:45 Europe/Bratislava, with a delayed-run guard window until 06:25.
    # Summer time: 03:45 UTC -> 05:45 CEST.
    # Winter time: 04:45 UTC -> 05:45 CET.
    - cron: "45 3,4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-tennis-predictions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TG_FEED_TIMEZONE: "Europe/Bratislava"
      TG_FEED_UPCOMING_ONLY: "true"
      TG_FEED_PAST_GRACE_MINUTES: "0"

    steps:
      - name: Check local run time
        id: local_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.getenv("EVENT_NAME", "")
          now = datetime.now(ZoneInfo("Europe/Bratislava"))

          # Manual runs must always execute. Scheduled runs are allowed inside
          # a safe window because GitHub runners can start several minutes late.
          in_schedule_window = (now.hour == 5 and now.minute >= 45) or (now.hour == 6 and now.minute <= 25)
          should_run = event_name == "workflow_dispatch" or in_schedule_window

          print(f"now={now.isoformat()}")
          print(f"event_name={event_name}")
          print("target_window=05:45-06:25 Europe/Bratislava")
          print(f"should_run={'true' if should_run else 'false'}")
          PY

      - name: Stop outside scheduled window
        if: ${{ steps.local_time.outputs.should_run != 'true' }}
        run: |
          echo "Outside production window. Skipping daily prediction run."

      - name: Checkout
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas lxml html5lib beautifulsoup4 requests

      - name: Run CorQ daily runtime
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m corq.engine --output-root outputs

      - name: Run CloQ value-first runtime
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m cloq.engine --input outputs/latest_all.json --output-root outputs

      - name: Validate runtime outputs
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def rows(path):
              if not path.exists():
                  return []
              payload = json.loads(path.read_text(encoding="utf-8"))
              if isinstance(payload, list):
                  return [x for x in payload if isinstance(x, dict)]
              if isinstance(payload, dict):
                  for key in ("rows", "items", "top7", "all", "data", "picks"):
                      val = payload.get(key)
                      if isinstance(val, list):
                          return [x for x in val if isinstance(x, dict)]
              return []

          top7 = rows(Path("outputs/latest_top7.json"))
          audit = rows(Path("outputs/latest_all.json"))
          cloq = rows(Path("outputs/cloq/latest_cloq.json"))
          cloq_flat = rows(Path("outputs/latest_cloq.json"))
          print(f"runtime_output_top7={len(top7)}")
          print(f"runtime_output_audit={len(audit)}")
          print(f"runtime_output_cloq={len(cloq)}")
          print(f"runtime_output_cloq_flat={len(cloq_flat)}")

          # Do not deploy a blank website if the runtime failed to build core data.
          if not audit:
              raise SystemExit("Runtime produced zero audit rows. Refusing to render/deploy blank site.")
          if not Path("outputs/cloq/latest_cloq.json").exists():
              raise SystemExit("CloQ runtime did not create outputs/cloq/latest_cloq.json")
          if not Path("outputs/latest_cloq.json").exists():
              raise SystemExit("CloQ runtime did not create outputs/latest_cloq.json")
          PY

      - name: Create immutable CorQ daily snapshot
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          import json
          import shutil
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path("outputs")
          source = root / "latest_top7.json"
          if not source.exists():
              raise SystemExit("outputs/latest_top7.json missing; cannot create CorQ daily snapshot")

          tz = ZoneInfo("Europe/Bratislava")
          now = datetime.now(tz)
          functional_day = (now.date() - timedelta(days=1)).isoformat() if now.hour < 5 else now.date().isoformat()

          snapshot_dir = root / "snapshots" / "corq_daily" / functional_day[:4] / functional_day[5:7]
          snapshot_dir.mkdir(parents=True, exist_ok=True)
          dated_snapshot = snapshot_dir / f"{functional_day}_corq_daily_snapshot.json"
          latest_snapshot = root / "snapshots" / "latest_corq_top7_snapshot.json"
          latest_snapshot.parent.mkdir(parents=True, exist_ok=True)

          if dated_snapshot.exists():
              print(f"CorQ daily snapshot already exists and will not be overwritten: {dated_snapshot}")
          else:
              shutil.copyfile(source, dated_snapshot)
              print(f"Created CorQ daily snapshot: {dated_snapshot}")

          shutil.copyfile(dated_snapshot, latest_snapshot)
          manifest = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "functional_day": functional_day,
              "snapshot_source": "CORQ_DAILY",
              "snapshot_type": "DAILY_CORQ_SNAPSHOT",
              "source_file": str(source),
              "dated_snapshot": str(dated_snapshot),
              "latest_snapshot": str(latest_snapshot),
              "policy": "immutable_first_snapshot_wins",
          }
          (root / "snapshots" / "latest_corq_top7_snapshot_manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Build Results CorQ snapshot ledger
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m corq.results_engine.results --output-root outputs --local-tz Europe/Bratislava

      - name: Diagnose ThinQ data sources
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          print("THINQ DATA SOURCE DIAGNOSTICS")
          try:
              from thinq.loaders.history_loader import history_data_status, get_player_matches
              status = history_data_status()
              print("history_status=", status)
              for player in ["Frances Tiafoe", "Terence Atmane", "Tommy Paul", "Kamil Majchrzak"]:
                  matches = get_player_matches(player, limit=3)
                  print(f"history_player={player} matches={len(matches)}")
                  for m in matches[:2]:
                      print("  ", m)
          except Exception as exc:
              print("history_diagnostic_error=", exc)
          try:
              from thinq.loaders.elo_loader import load_elo_index, build_elo_context
              idx = load_elo_index()
              print("elo_index_size=", len(idx))
              for pick, opp in [("Frances Tiafoe", "Terence Atmane"), ("Tommy Paul", "Kamil Majchrzak")]:
                  print(f"elo_context={pick} vs {opp}", build_elo_context(pick, opp, "Hard"))
          except Exception as exc:
              print("elo_diagnostic_error=", exc)
          PY

      - name: Diagnose TOP7 filters
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("outputs/latest_all.json")
          if not path.exists():
              print("No outputs/latest_all.json found for TOP7 diagnostics.")
              raise SystemExit(0)

          payload = json.loads(path.read_text(encoding="utf-8"))
          rows = payload if isinstance(payload, list) else []
          if isinstance(payload, dict):
              for key in ("rows", "items", "all", "data"):
                  if isinstance(payload.get(key), list):
                      rows = payload.get(key)
                      break
          rows = [r for r in rows if isinstance(r, dict)]

          publishable = [r for r in rows if r.get("top7_publishable") is True]
          print(f"top7_diagnostic_rows={len(rows)}")
          print(f"top7_publishable_rows={len(publishable)}")

          reason_keys = (
              "top7_reject_reasons",
              "top7_quality_reject_reasons",
              "reject_reasons",
              "corq_reject_reasons",
              "risk_flags",
              "corq_risk_flags",
              "flags",
          )
          reasons = Counter()
          for row in rows:
              if row.get("top7_publishable") is True:
                  continue
              found = False
              for key in reason_keys:
                  val = row.get(key)
                  if isinstance(val, list):
                      for item in val:
                          if item:
                              reasons[str(item)] += 1
                              found = True
                  elif isinstance(val, str) and val.strip():
                      reasons[val.strip()] += 1
                      found = True
              if not found:
                  reasons["NO_REJECT_REASON_FIELD"] += 1

          print("TOP7 reject reason summary:")
          for reason, count in reasons.most_common(30):
              print(f"  {count:4d}  {reason}")

          def first_val(row, keys):
              for key in keys:
                  if row.get(key) not in (None, ""):
                      return row.get(key)
              return None

          print("TOP7 sample rejected rows:")
          for idx, row in enumerate(rows[:12], start=1):
              pick = first_val(row, ("pick", "player", "player1", "home"))
              opp = first_val(row, ("opponent", "opp", "player2", "away"))
              prob = first_val(row, ("corq_probability", "corq_estimated_win_probability", "win_probability", "probability"))
              odds = first_val(row, ("pick_odds", "odds", "odds_player1", "home_odds"))
              thinq = first_val(row, ("thinq_confidence", "thinq_probability_confidence", "data_confidence"))
              depth = first_val(row, ("stat_data_depth", "pick_data_depth", "data_depth"))
              form = first_val(row, ("form_data_depth", "form_confidence", "recent_form_confidence"))
              row_reasons = []
              for key in reason_keys:
                  val = row.get(key)
                  if isinstance(val, list):
                      row_reasons.extend(str(x) for x in val if x)
                  elif isinstance(val, str) and val.strip():
                      row_reasons.append(val.strip())
              print(f"  {idx}. {pick} vs {opp} | prob={prob} odds={odds} thinq={thinq} stat_depth={depth} form_depth={form} | reasons={row_reasons[:8] or ['NONE']}")
          PY

      - name: Render web site
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m corq.web.render

      - name: Commit generated outputs
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # outputs/ and corq/site/ are generated by this run. If another run
          # pushes generated files first, avoid rebase conflicts in
          # corq/site/render_manifest.json by preserving this run's generated
          # folders, resetting to origin/main, then restoring and committing them.
          git add outputs corq/site || true

          if git diff --cached --quiet; then
            echo "No generated output changes to commit."
            exit 0
          fi

          git commit -m "Update daily tennis predictions"
          if git push; then
            echo "Generated outputs pushed."
            exit 0
          fi

          echo "Push rejected, preserving generated outputs and retrying on latest main..."
          tmp_dir="$(mktemp -d)"
          cp -a outputs "$tmp_dir/outputs" 2>/dev/null || true
          cp -a corq/site "$tmp_dir/site" 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          rm -rf outputs corq/site
          [ -d "$tmp_dir/outputs" ] && cp -a "$tmp_dir/outputs" outputs
          mkdir -p corq
          [ -d "$tmp_dir/site" ] && cp -a "$tmp_dir/site" corq/site
          git add outputs corq/site || true
          if git diff --cached --quiet; then
            echo "No generated output changes after reset."
            exit 0
          fi
          git commit -m "Update daily tennis predictions"
          git push

      - name: Upload Pages artifact
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: corq/site

      - name: Deploy to GitHub Pages
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        uses: actions/deploy-pages@v4
