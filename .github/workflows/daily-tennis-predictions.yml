name: Daily Tennis Predictions

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - daily-tennis-predictions
      - corq-daily-snapshot

permissions:
  contents: write

concurrency:
  group: daily-tennis-predictions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TG_FEED_TIMEZONE: "Europe/Bratislava"
      TG_FEED_UPCOMING_ONLY: "true"
      TG_FEED_PAST_GRACE_MINUTES: "0"
      CORQ_PRESERVE_LATEST_TOP7_ON_EMPTY: "true"

    steps:
      - name: Check local run time
        id: local_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.getenv("EVENT_NAME", "")
          now = datetime.now(ZoneInfo("Europe/Bratislava"))

          # All production runs are started by an external Cron through
          # workflow_dispatch or repository_dispatch. GitHub Actions no longer
          # owns the schedule, so do not apply an internal time-window gate.
          should_run = event_name in {"workflow_dispatch", "repository_dispatch"}

          print(f"now={now.isoformat()}")
          print(f"event_name={event_name}")
          print("trigger_policy=external_cron_or_manual_dispatch")
          print("betting_day_policy=Europe/Bratislava 06:00-06:00")
          print(f"should_run={'true' if should_run else 'false'}")
          PY

      - name: Stop outside scheduled window
        if: ${{ steps.local_time.outputs.should_run != 'true' }}
        run: |
          echo "Unsupported trigger. External Cron must use workflow_dispatch or repository_dispatch."

      - name: Checkout
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas lxml html5lib beautifulsoup4 requests

      - name: Evaluate previous CorQ snapshot results
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          # This runs before today's CorQ runtime so the Telegram/results layer can
          # settle yesterday's immutable morning snapshot from the committed outputs.
          # The new snapshot is created later in this workflow and then inserted as Pending.
          python -m corq.results_engine.results --output-root outputs --local-tz Europe/Bratislava

      - name: Run CorQ daily runtime
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m corq.engine --output-root outputs

      - name: Run CloQ value-first runtime
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m cloq.engine --input outputs/latest_all.json --output-root outputs

      - name: Finalize CorQ TOP7 after CloQ priority
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          # CloQ has priority. CorQ TOP7 is rebuilt from the saved ALL pool,
          # removes matches already selected by CloQ, and fills back to TOP7.
          python -m corq.engine --output-root outputs --finalize-top7-from-latest-all

      - name: Validate runtime outputs
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def rows(path):
              if not path.exists():
                  return []
              payload = json.loads(path.read_text(encoding="utf-8"))
              if isinstance(payload, list):
                  return [x for x in payload if isinstance(x, dict)]
              if isinstance(payload, dict):
                  for key in ("rows", "items", "top7", "all", "data", "picks"):
                      val = payload.get(key)
                      if isinstance(val, list):
                          return [x for x in val if isinstance(x, dict)]
              return []

          top7 = rows(Path("outputs/latest_top7.json"))
          audit = rows(Path("outputs/latest_all.json"))
          cloq = rows(Path("outputs/cloq/latest_cloq.json"))
          cloq_flat = rows(Path("outputs/latest_cloq.json"))
          print(f"runtime_output_top7={len(top7)}")
          print(f"runtime_output_audit={len(audit)}")
          print(f"runtime_output_cloq={len(cloq)}")
          print(f"runtime_output_cloq_flat={len(cloq_flat)}")

          manifest_path = Path("outputs/latest_manifest.json")
          manifest = {}
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          manifest_top7_count = manifest.get("top7_count")
          print(f"runtime_manifest_top7_count={manifest_top7_count}")
          print(f"runtime_manifest_betting_day={manifest.get('betting_day')}")
          print(f"runtime_manifest_window={manifest.get('betting_day_start_local')} -> {manifest.get('betting_day_end_local')}")

          # Do not deploy a blank website if the runtime failed to build core data.
          if not audit:
              raise SystemExit("Runtime produced zero audit rows. Refusing to render/deploy blank site.")

          # Protect the latest public TOP7 and snapshot pipeline. A late/manual run
          # that sees only finished matches must not create/commit a blank TOP7 run.
          if manifest_top7_count == 0 or not top7:
              raise SystemExit("Runtime produced zero TOP7 rows. Refusing to render/snapshot/deploy blank TOP7; keeping last valid committed output.")

          # Enforce Audit/TOP7 betting-day consistency: every audit row must be inside
          # the same Europe/Bratislava 06:00 -> 06:00 window persisted by corq.engine.
          try:
              from datetime import datetime
              from zoneinfo import ZoneInfo

              start_local = datetime.fromisoformat(str(manifest.get("betting_day_start_local")))
              end_local = datetime.fromisoformat(str(manifest.get("betting_day_end_local")))
              tz = ZoneInfo("Europe/Bratislava")
              outside_window = []
              status_counts = {}
              for row in audit:
                  status_key = str(row.get("status_type") or row.get("match_status_type") or "unknown").lower()
                  status_counts[status_key] = status_counts.get(status_key, 0) + 1
                  raw_start = row.get("match_start") or row.get("start_time") or row.get("start_time_utc") or row.get("match_time_utc")
                  if not raw_start:
                      continue
                  dt = datetime.fromisoformat(str(raw_start).replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=tz)
                  dt_local = dt.astimezone(tz)
                  if dt_local < start_local or dt_local >= end_local:
                      outside_window.append({
                          "event_id": row.get("event_id") or row.get("match_id") or row.get("id"),
                          "pick": row.get("pick"),
                          "start_local": dt_local.isoformat(),
                      })
              print(f"runtime_audit_status_counts={status_counts}")
              print(f"runtime_audit_outside_betting_window={len(outside_window)}")
              if outside_window:
                  print("runtime_audit_outside_betting_window_sample=", outside_window[:8])
                  raise SystemExit("Audit rows outside the 06:00-06:00 Europe/Bratislava betting-day window. Refusing deploy.")
              if status_counts and set(status_counts.keys()).issubset({"finished", "ended", "complete", "completed"}):
                  raise SystemExit("Audit output contains only completed matches. Refusing deploy because this indicates a stale/wrong candidate window.")
          except SystemExit:
              raise
          except Exception as exc:
              raise SystemExit(f"Could not validate audit betting-day window: {exc}")

          if not Path("outputs/cloq/latest_cloq.json").exists():
              raise SystemExit("CloQ runtime did not create outputs/cloq/latest_cloq.json")
          if not Path("outputs/latest_cloq.json").exists():
              raise SystemExit("CloQ runtime did not create outputs/latest_cloq.json")
          PY

      - name: Build MarQ API coverage report
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python tools/marq_coverage_report.py --output-root outputs

      - name: Create immutable CorQ daily snapshot
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          import json
          import shutil
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path("outputs")
          source = root / "latest_top7.json"
          if not source.exists():
              raise SystemExit("outputs/latest_top7.json missing; cannot create CorQ daily snapshot")

          tz = ZoneInfo("Europe/Bratislava")
          now = datetime.now(tz)
          betting_day_date = (now.date() - timedelta(days=1)) if now.hour < 6 else now.date()
          betting_day = betting_day_date.isoformat()
          betting_day_start = datetime.combine(betting_day_date, datetime.min.time(), tzinfo=tz).replace(hour=6)
          betting_day_end = betting_day_start + timedelta(days=1)

          snapshot_dir = root / "snapshots" / "corq_daily" / betting_day[:4] / betting_day[5:7]
          snapshot_dir.mkdir(parents=True, exist_ok=True)
          dated_snapshot = snapshot_dir / f"{betting_day}_corq_daily_snapshot.json"
          latest_snapshot = root / "snapshots" / "latest_corq_top7_snapshot.json"
          latest_snapshot.parent.mkdir(parents=True, exist_ok=True)

          def enrich_snapshot_rows(rows, *, source_label):
              if not isinstance(rows, list):
                  raise SystemExit(f"{source_label} is not a list; cannot create CorQ daily snapshot")
              enriched_rows = []
              snapshot_id = f"CORQ_TOP7_{betting_day}"
              created_at = datetime.now(timezone.utc).isoformat()
              for idx, row in enumerate(rows, start=1):
                  if not isinstance(row, dict):
                      continue
                  item = dict(row)
                  item.setdefault("snapshot_id", snapshot_id)
                  item.setdefault("snapshot_type", "CORQ_TOP7")
                  item.setdefault("snapshot_source", "CORQ_DAILY")
                  item.setdefault("snapshot_rank", idx)
                  item.setdefault("snapshot_date", betting_day)
                  item.setdefault("betting_day", betting_day)
                  item.setdefault("betting_day_start_local", betting_day_start.isoformat())
                  item.setdefault("betting_day_end_local", betting_day_end.isoformat())
                  item.setdefault("snapshot_timezone", "Europe/Bratislava")
                  item.setdefault("snapshot_created_at_utc", created_at)
                  item.setdefault("results_status", "PENDING")
                  enriched_rows.append(item)
              return enriched_rows

          def missing_snapshot_metadata(rows):
              required = (
                  "snapshot_id",
                  "snapshot_type",
                  "snapshot_source",
                  "snapshot_rank",
                  "snapshot_date",
                  "betting_day",
                  "betting_day_start_local",
                  "betting_day_end_local",
                  "snapshot_created_at_utc",
                  "results_status",
              )
              for row in rows or []:
                  if not isinstance(row, dict):
                      continue
                  for key in required:
                      if row.get(key) in (None, ""):
                          return True
              return False

          manifest_path = root / "latest_manifest.json"
          if manifest_path.exists():
              manifest_payload = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest_payload.get("top7_count") == 0:
                  raise SystemExit("latest_manifest.json reports top7_count=0; refusing to create an empty CorQ daily snapshot")

          source_rows = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(source_rows, list) or not source_rows:
              raise SystemExit("outputs/latest_top7.json is empty; refusing to create an empty CorQ daily snapshot")

          enriched = enrich_snapshot_rows(source_rows, source_label=str(source))

          if dated_snapshot.exists():
              existing_rows = json.loads(dated_snapshot.read_text(encoding="utf-8"))
              if not isinstance(existing_rows, list):
                  raise SystemExit(f"Existing CorQ daily snapshot is not a list: {dated_snapshot}")
              if missing_snapshot_metadata(existing_rows):
                  repaired = enrich_snapshot_rows(existing_rows, source_label=str(dated_snapshot))
                  dated_snapshot.write_text(json.dumps(repaired, indent=2, ensure_ascii=False), encoding="utf-8")
                  print(f"Repaired missing snapshot metadata without changing picks: {dated_snapshot}")
              else:
                  print(f"CorQ daily snapshot already exists and will not be overwritten: {dated_snapshot}")
          else:
              dated_snapshot.write_text(json.dumps(enriched, indent=2, ensure_ascii=False), encoding="utf-8")
              print(f"Created CorQ daily snapshot: {dated_snapshot}")

          shutil.copyfile(dated_snapshot, latest_snapshot)
          manifest = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "functional_day": betting_day,
              "betting_day": betting_day,
              "betting_day_start_local": betting_day_start.isoformat(),
              "betting_day_end_local": betting_day_end.isoformat(),
              "timezone": "Europe/Bratislava",
              "snapshot_source": "CORQ_DAILY",
              "snapshot_type": "DAILY_CORQ_SNAPSHOT",
              "source_file": str(source),
              "dated_snapshot": str(dated_snapshot),
              "latest_snapshot": str(latest_snapshot),
              "policy": "immutable_first_snapshot_wins_0600_betting_day",
          }
          (root / "snapshots" / "latest_corq_top7_snapshot_manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Build Results CorQ snapshot ledger
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m corq.results_engine.results --output-root outputs --local-tz Europe/Bratislava

      - name: Diagnose ThinQ data sources
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          print("THINQ DATA SOURCE DIAGNOSTICS")
          try:
              from thinq.loaders.history_loader import history_data_status, get_player_matches
              status = history_data_status()
              print("history_status=", status)
              for player in ["Frances Tiafoe", "Terence Atmane", "Tommy Paul", "Kamil Majchrzak"]:
                  matches = get_player_matches(player, limit=3)
                  print(f"history_player={player} matches={len(matches)}")
                  for m in matches[:2]:
                      print("  ", m)
          except Exception as exc:
              print("history_diagnostic_error=", exc)
          try:
              from thinq.loaders.elo_loader import load_elo_index, build_elo_context
              idx = load_elo_index()
              print("elo_index_size=", len(idx))
              for pick, opp in [("Frances Tiafoe", "Terence Atmane"), ("Tommy Paul", "Kamil Majchrzak")]:
                  print(f"elo_context={pick} vs {opp}", build_elo_context(pick, opp, "Hard"))
          except Exception as exc:
              print("elo_diagnostic_error=", exc)
          PY

      - name: Diagnose TOP7 filters
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("outputs/latest_all.json")
          if not path.exists():
              print("No outputs/latest_all.json found for TOP7 diagnostics.")
              raise SystemExit(0)

          payload = json.loads(path.read_text(encoding="utf-8"))
          rows = payload if isinstance(payload, list) else []
          if isinstance(payload, dict):
              for key in ("rows", "items", "all", "data"):
                  if isinstance(payload.get(key), list):
                      rows = payload.get(key)
                      break
          rows = [r for r in rows if isinstance(r, dict)]

          publishable = [r for r in rows if r.get("top7_publishable") is True]
          selected = [r for r in rows if r.get("top7_rank") or r.get("top7_selected") is True]

          print(f"top7_diagnostic_rows={len(rows)}")
          print(f"top7_publishable_rows={len(publishable)}")
          print(f"top7_selected_rows={len(selected)}")

          hard = Counter()
          soft = Counter()
          no_hard_no_publishable = 0

          for row in rows:
              hard_reasons = row.get("top7_hard_reject_reasons")
              if hard_reasons is None:
                  hard_reasons = row.get("top7_reject_reasons") or row.get("top7_quality_reject_reasons") or []
              if isinstance(hard_reasons, str):
                  hard_reasons = [hard_reasons]
              hard_reasons = sorted({str(x) for x in hard_reasons if x})

              soft_reasons = row.get("top7_soft_penalty_reasons") or []
              if isinstance(soft_reasons, str):
                  soft_reasons = [soft_reasons]
              soft_reasons = sorted({str(x) for x in soft_reasons if x})

              if hard_reasons:
                  for reason in hard_reasons:
                      hard[reason] += 1
              elif row.get("top7_publishable") is not True:
                  no_hard_no_publishable += 1

              for reason in soft_reasons:
                  soft[reason] += 1

          print("TOP7 hard reject summary:")
          if hard:
              for reason, count in hard.most_common(30):
                  print(f"  {count:4d}  {reason}")
          else:
              print("     0  NONE")
          if no_hard_no_publishable:
              print(f"  {no_hard_no_publishable:4d}  NO_HARD_REASON_BUT_NOT_PUBLISHABLE")

          print("TOP7 soft penalty summary:")
          if soft:
              for reason, count in soft.most_common(30):
                  print(f"  {count:4d}  {reason}")
          else:
              print("     0  NONE")

          def first_val(row, keys):
              for key in keys:
                  if row.get(key) not in (None, ""):
                      return row.get(key)
              return None

          def describe(row):
              pick = first_val(row, ("pick", "player", "player1", "home"))
              opp = first_val(row, ("opponent", "opp", "player2", "away"))
              prob = first_val(row, ("corq_probability", "corq_estimated_win_probability", "win_probability", "probability"))
              odds = first_val(row, ("pick_odds", "odds", "odds_player1", "home_odds"))
              score = first_val(row, ("corq_top7_sort_score", "top7_quality_score"))
              hard_reasons = row.get("top7_hard_reject_reasons") or row.get("top7_reject_reasons") or []
              soft_reasons = row.get("top7_soft_penalty_reasons") or []
              return f"{pick} vs {opp} | prob={prob} odds={odds} score={score} | hard={hard_reasons or ['NONE']} | soft={soft_reasons[:6] or ['NONE']}"

          print("TOP7 selected sample:")
          for idx, row in enumerate((selected or publishable)[:10], start=1):
              print(f"  {idx}. {describe(row)}")

          print("TOP7 hard-rejected sample:")
          rejected = [r for r in rows if (r.get("top7_hard_reject_reasons") or r.get("top7_reject_reasons") or r.get("top7_quality_reject_reasons"))]
          for idx, row in enumerate(rejected[:10], start=1):
              print(f"  {idx}. {describe(row)}")
          PY

      - name: Render web site
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          python -m corq.web.render

      - name: Inspect generated site before cleanup
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          echo "[site] top-level size"
          du -sh corq/site || true
          echo "[site] file count"
          find corq/site -type f | wc -l || true
          echo "[site] largest files before cleanup"
          find corq/site -type f -printf '%s %p\n' | sort -nr | head -30 || true

      - name: Keep Pages artifact small
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          # Pages deployment can time out when the uploaded artifact is too large.
          # Keep the committed and deployed site focused on generated public pages.
          rm -rf corq/site/logs || true
          find corq/site -type f \( -name "*.log" -o -name "*.tmp" -o -name "*.bak" \) -delete || true
          find corq/site -type f -name "*.json" -size +5M -print -delete || true
          find corq/site -type f -size +95M -print -delete || true
          echo "[site] size after cleanup"
          du -sh corq/site || true
          echo "[site] largest files after cleanup"
          find corq/site -type f -printf '%s %p\n' | sort -nr | head -30 || true

      - name: Commit generated outputs
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # outputs/ and corq/site/ are generated by this run. If another run
          # pushes generated files first, avoid rebase conflicts in
          # corq/site/render_manifest.json by preserving this run's generated
          # folders, resetting to origin/main, then restoring and committing them.
          git add outputs corq/site || true

          if git diff --cached --quiet; then
            echo "No generated output changes to commit."
            exit 0
          fi

          git commit -m "Update daily tennis predictions"
          if git push; then
            echo "Generated outputs pushed."
            exit 0
          fi

          echo "Push rejected, preserving generated outputs and retrying on latest main..."
          tmp_dir="$(mktemp -d)"
          cp -a outputs "$tmp_dir/outputs" 2>/dev/null || true
          cp -a corq/site "$tmp_dir/site" 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          rm -rf outputs corq/site
          [ -d "$tmp_dir/outputs" ] && cp -a "$tmp_dir/outputs" outputs
          mkdir -p corq
          [ -d "$tmp_dir/site" ] && cp -a "$tmp_dir/site" corq/site
          git add outputs corq/site || true
          if git diff --cached --quiet; then
            echo "No generated output changes after reset."
            exit 0
          fi
          git commit -m "Update daily tennis predictions"
          git push

      - name: Pages deploy handled by Web Render Only
        if: ${{ steps.local_time.outputs.should_run == 'true' }}
        run: |
          echo "Daily run updates outputs and rendered site files only."
          echo "GitHub Pages deployment is handled by .github/workflows/web-render-only.yml."
