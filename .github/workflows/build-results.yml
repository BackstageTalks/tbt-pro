name: build-results

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "0 22 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug Results modules
        run: |
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          find . -maxdepth 4 -type f | sort | grep -E '(^./corq/results|results_engine|results_db|results.py|workflow)' || true
          python - <<'PY'
          import os, sys
          print('cwd=', os.getcwd())
          print('sys.path[0]=', sys.path[0])
          PY

      - name: Build persistent Results database
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m corq.results_engine.results             --output-root outputs             --fetch-api             --settle-yesterday             --local-tz Europe/Bratislava             --settlement-grace-hours 2

      - name: Render web site with updated Results
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m corq.web.render

      - name: Commit results and rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/results corq/site
          git commit -m "Update results database and rendered site" || echo "No result/site changes"
          git push
