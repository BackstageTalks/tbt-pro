name: GB Web Render Only

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy rendered site to GitHub Pages
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gb-web-render-only-main
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  TENNISAPI_ATTACH_RANKINGS: "0"
  CORQ_RENDER_ENABLE_LOGS: "0"
  TZ: Europe/Bratislava

jobs:
  render-and-deploy:
    name: Rebuild and deploy current GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Confirm latest main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          echo "Rendering commit: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          test ! -f requirements.txt || python -m pip install -r requirements.txt

      - name: Validate current daily inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/latest_manifest.json
          test -s outputs/latest_top7.json
          test -s outputs/latest_all.json
          test -s outputs/cloq/latest_cloq.json
          test -s corq/web/render.py

          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Bratislava")
          now = datetime.now(tz)
          expected_day = (now.date() - timedelta(days=1) if now.hour < 6 else now.date()).isoformat()

          manifest = json.loads(Path("outputs/latest_manifest.json").read_text(encoding="utf-8"))
          actual_day = str(manifest.get("betting_day") or manifest.get("functional_day") or "")
          if actual_day != expected_day:
              raise SystemExit(
                  f"Refusing stale GitHub Pages deploy: expected betting day {expected_day}, got {actual_day or 'missing'}"
              )

          def rows(path):
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              if isinstance(payload, list):
                  return [x for x in payload if isinstance(x, dict)]
              if isinstance(payload, dict):
                  for key in ("rows", "items", "top7", "all", "cloq", "data", "picks"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return [x for x in value if isinstance(x, dict)]
              return []

          counts = {
              "top7": len(rows("outputs/latest_top7.json")),
              "audit": len(rows("outputs/latest_all.json")),
              "cloq": len(rows("outputs/cloq/latest_cloq.json")),
          }
          if counts["top7"] == 0 or counts["audit"] == 0 or counts["cloq"] == 0:
              raise SystemExit(f"Refusing incomplete GitHub Pages deploy: {counts}")

          print({"expected_betting_day": expected_day, "manifest_betting_day": actual_day, **counts})
          PY

      - name: Compile renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile corq/web/render.py corq/web/paths.py

      - name: Render GitHub Pages only
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf corq/site
          python -m corq.web.render

      - name: Validate rendered daily pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from corq.web.paths import ALL_PATH, CLOQ_PATH, RESULTS_PATH, THINQ_PATH, TOP7_PATH

          manifest = json.loads(Path("outputs/latest_manifest.json").read_text(encoding="utf-8"))
          betting_day = str(manifest.get("betting_day") or manifest.get("functional_day") or "")
          if not betting_day:
              raise SystemExit("Rendered-page validation cannot determine betting day")

          required = {
              "root": Path("corq/site/index.html"),
              "corq": Path("corq/site") / TOP7_PATH / "index.html",
              "cloq": Path("corq/site") / CLOQ_PATH / "index.html",
              "audit": Path("corq/site") / ALL_PATH / "index.html",
              "results": Path("corq/site") / RESULTS_PATH / "index.html",
              "thinq": Path("corq/site") / THINQ_PATH / "index.html",
          }
          missing = [name for name, path in required.items() if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f"Missing rendered GitHub Pages: {missing}")

          cloq_html = required["cloq"].read_text(encoding="utf-8")
          expected_date = ".".join(reversed(betting_day.split("-")))
          expected_short_date = expected_date[:-4] + expected_date[-2:] if len(expected_date) == 10 else expected_date
          date_tokens = {betting_day, expected_date, expected_short_date}
          if not any(token and token in cloq_html for token in date_tokens):
              raise SystemExit(
                  f"Refusing stale CloQ page: rendered HTML does not contain betting day {betting_day}"
              )

          print({
              "betting_day": betting_day,
              "cloq_page": str(required["cloq"]),
              "cloq_bytes": required["cloq"].stat().st_size,
              "rendered_pages": len(required),
          })
          PY

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf corq/site/logs
          find corq/site -type f \( -name "*.log" -o -name "*.tmp" -o -name "*.bak" -o -name "*.pyc" \) -delete
          find corq/site -type d -name "__pycache__" -prune -exec rm -rf {} +
          touch corq/site/.nojekyll
          test -s corq/site/index.html
          du -sh corq/site

      - name: Configure GitHub Pages
        if: inputs.deploy_pages == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: inputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: corq/site

      - name: Deploy GitHub Pages
        if: inputs.deploy_pages == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
