name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "blinq/**"
      - "thinq/**"
      - "tools/build_player_registry.py"
      - "requirements.txt"
      - ".github/workflows/azure-static-web-apps-agreeable-sky-011a7fe10.yml"

permissions:
  contents: read

concurrency:
  group: azure-blinq-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          test ! -f requirements.txt || python -m pip install -r requirements.txt
          test ! -f api/requirements.txt || python -m pip install -r api/requirements.txt

      - name: Validate source contracts
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo "SUPABASE_ANON_KEY is missing"; exit 1; }
          test -s blinq/web/render.py
          test -s blinq/web/plans.json
          test -s blinq/service.py
          test -s api/function_app.py
          test -s api/host.json
          test -s api/requirements.txt
          python -m py_compile blinq/web/render.py blinq/service.py api/function_app.py

      - name: Validate plans configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          path = Path("blinq/web/plans.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          for key in ("pro", "pro_plus"):
              plan = data.get(key)
              if not isinstance(plan, dict):
                  raise SystemExit(f"Missing plan object: {key}")
              if not isinstance(plan.get("enabled"), bool):
                  raise SystemExit(f"Invalid enabled flag: {key}")
              if not str(plan.get("label") or "").strip():
                  raise SystemExit(f"Missing label: {key}")
              if plan["enabled"]:
                  url = str(plan.get("url") or "").strip()
                  parsed = urlparse(url)
                  if parsed.scheme != "https" or not parsed.netloc:
                      raise SystemExit(f"Invalid HTTPS payment URL: {key}")
          print("Plans configuration contract passed")
          PY

      - name: Build player registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_player_registry.py
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("thinq/data/players/player_registry.json").read_text(encoding="utf-8")
          )
          rows = data.get("players", []) if isinstance(data, dict) else []
          count = len(rows) if isinstance(rows, (list, dict)) else 0
          if count < 100:
              raise SystemExit(f"Registry too small: {count}")
          print(f"BlinQ registry players: {count}")
          PY

      - name: Build isolated BlinQ site
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json
          import shlex
          from pathlib import Path

          data = json.loads(Path("blinq/web/plans.json").read_text(encoding="utf-8"))
          pro = data.get("pro", {})
          pro_plus = data.get("pro_plus", {})
          values = {
              "BLINQ_PRO_PAYMENT_URL": pro.get("url", "") if pro.get("enabled") else "",
              "BLINQ_PRO_PLUS_PAYMENT_URL": pro_plus.get("url", "") if pro_plus.get("enabled") else "",
          }
          for key, value in values.items():
              print(f"export {key}={shlex.quote(str(value))}")
          PY
          )"

          rm -rf azure-site
          mkdir -p azure-site/follow-the-data azure-site/blinq-portal-k7m3q9
          python -m blinq.web.render --output azure-site/follow-the-data/index.html

          cat > azure-site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=/follow-the-data/">
            <link rel="canonical" href="/follow-the-data/">
            <title>Redirecting to BlinQ</title>
          </head>
          <body><a href="/follow-the-data/">Continue to BlinQ</a></body>
          </html>
          HTML
          cp azure-site/index.html azure-site/blinq-portal-k7m3q9/index.html

          cat > azure-site/staticwebapp.config.json <<'JSON'
          {
            "platform": {"apiRuntime": "python:3.11"},
            "globalHeaders": {
              "Cache-Control": "no-store",
              "X-Content-Type-Options": "nosniff",
              "Referrer-Policy": "strict-origin-when-cross-origin"
            },
            "navigationFallback": {
              "rewrite": "/index.html",
              "exclude": [
                "/api/*",
                "/.auth/*",
                "/*.{css,js,png,jpg,jpeg,webp,svg,ico,json}"
              ]
            }
          }
          JSON

      - name: Validate built site contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ContractParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  value = dict(attrs).get("id")
                  if value:
                      self.ids.add(value)

          page = Path("azure-site/follow-the-data/index.html")
          if not page.is_file() or page.stat().st_size == 0:
              raise SystemExit("BlinQ page is missing or empty")

          text = page.read_text(encoding="utf-8")
          parser = ContractParser()
          parser.feed(text)
          required = {
              "signIn", "signUp", "forgotPassword", "signOut",
              "p1", "p2", "surface", "run", "result",
              "planBadge", "planDetail", "upgrade", "upgradeModal",
              "proPayment", "proPlusPayment", "closeUpgrade"
          }
          missing = sorted(required - parser.ids)
          if missing:
              raise SystemExit(f"Missing frontend contract ids: {missing}")
          unresolved = (
              "__SUPABASE_",
              "__PRO_PAYMENT_URL__",
              "__PRO_PLUS_PAYMENT_URL__",
          )
          if any(marker in text for marker in unresolved):
              raise SystemExit("Unresolved frontend placeholder")
          print("Built site contract passed")
          PY

          size=$(du -sb azure-site | awk '{print $1}')
          echo "Azure static artifact bytes: $size"
          test "$size" -le 25000000

      - name: Prepare managed API
        shell: bash
        run: |
          set -euo pipefail
          rm -rf api/blinq api/thinq api/corq
          cp -R blinq api/blinq
          cp -R thinq api/thinq
          test ! -d corq || cp -R corq api/corq
          rm -rf api/blinq/web api/corq/site api/corq/outputs api/corq/logs api/thinq/outputs
          find api -type d -name "__pycache__" -prune -exec rm -rf {} +
          find api -type f \( -name "*.pyc" -o -name "*.log" -o -name "*.tmp" -o -name "*.bak" \) -delete
          python -m py_compile api/function_app.py api/blinq/service.py

          size=$(du -sb api | awk '{print $1}')
          echo "Azure API artifact bytes: $size"
          test "$size" -le 100000000

      - name: Deploy BlinQ
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: azure-site
          api_location: api
          output_location: ""
          skip_app_build: true
